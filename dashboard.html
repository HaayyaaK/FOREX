           Selectors also become shrinkable so the two groups hold one row. */
      @media (max-width: 760px) {
        .ctrl-field > label {
          position: absolute;
          width: 1px;
          height: 1px;
          margin: -1px;
          padding: 0;
          border: 0;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }
        .ctrl-selectors {
          flex: 1 1 0;
        }
        .ctrl-selectors .symbol-select {
          flex: 1 1 0;
          min-width: 56px;
        }
        .ctrl-selectors .select-wrap,
        .ctrl-selectors select {
          min-width: 0;
        }
        .ctrl-selectors select {
          text-overflow: ellipsis;
        }
      }

      /* ---------------- Below 620px: compact chrome + icon-only Analyze ---- */
      @media (max-width: 620px) {
        .header {
          justify-content: center;
        }
        .header .status {
          margin-inline-end: auto;
        }
        .controls {
          gap: var(--sp-3);
          padding-inline-start: var(--sp-3);
          padding-inline-end: var(--sp-3);
        }
        .ctrl-buttons {
          gap: var(--sp-3);
        }

        /* Analyze collapses to an ICON button; the caret stays for the menu. */
        .analyze-main .analyze-text {
          display: none;
        }
        .analyze-main {
          padding: 0;
          width: var(--control-h);
          justify-content: center;
        }
        .analyze-main .analyze-icon {
          font-size: 1.05em;
        }
      }

      /* ---------------- Below 340px: market-status chip → bare dot ----------
           Drops the chip's pill chrome (padding/border/background) so only the
           status dot shows, reclaiming ~14px. The clock stays. Header padding and
           gaps tighten so brand · status · actions still hold ONE row at 320px;
           the brand (only shrink sink) absorbs any remaining shortfall. */
      @media (max-width: 340px) {
        .conn-chip {
          width: auto;
          height: auto;
          padding-inline-start: var(--sp-2);
          padding-inline-end: var(--sp-2);
          background: none;
          border: none;
        }
        .header {
          padding-inline-start: var(--sp-3);
          padding-inline-end: var(--sp-3);
          gap: var(--sp-2);
        }
        .header-actions {
          gap: var(--sp-2);
        }
        .header .status {
          gap: var(--sp-2);
        }
        /* Brand collapses to its logo icon (cleaner than an ellipsis) — the
               "KEEN" text node is zeroed while the icon is re-sized up. */
        .header h1 .brand-ico {
          font-size: calc(var(--fs-md) + 0.2rem);
          margin-inline-end: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app" data-workspace="charts">
      <!-- Persistent chrome: brand, status, header actions and controls stay
         visible on both workspaces so Analyze and the switchers never
         scroll off-screen. -->
      <div class="app-header">
        <div class="header">
          <h1 id="brandHome" role="button" tabindex="0" aria-label="KEEN — go to the Charts workspace" title="Go to Charts">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
            KEEN
          </h1>

          <div class="status">
            <span class="conn-chip" id="connChip" title="Analysis proxy connection: Idle">
              <span class="dot" id="connDot"></span>
            </span>
            <!-- Time stays as the label; hover (desktop) or tap (mobile) reveals
                     the full day + date in a design-matched popover. -->
            <span class="clock-wrap" id="clockWrap" tabindex="0" role="button" aria-label="Show today's full date" aria-expanded="false">
              <span id="clock">--:--:-- --</span>
              <span class="clock-pop" id="clockPop" role="tooltip" aria-hidden="true"></span>
            </span>
          </div>

          <!-- Header actions: workspace toggle, Calculator, Save Profile — one fixed group at the end. -->
          <div class="header-actions">
            <button type="button" class="icon-btn" id="wsToggle" aria-pressed="false" aria-label="Switch to KEEN" title="Switch to KEEN">
              <i class="fa-solid fa-magnifying-glass-dollar" id="wsToggleIcon" aria-hidden="true"></i>
            </button>
            <a class="icon-btn" id="calcLink" href="calc.html" aria-label="Open Calculator" title="Open Calculator"><i class="fa-solid fa-calculator" aria-hidden="true"></i></a>
            <a class="icon-btn" id="validationLink" href="validation.html" aria-label="Open Strategy Validation" title="Open Strategy Validation"><i class="fa-solid fa-flask-vial" aria-hidden="true"></i></a>
            <button type="button" class="icon-btn" id="saveProfileBtn" aria-pressed="false" aria-label="Save profile preferences" title="Save profile preferences">
              <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Controls — two dedicated groups that always stay on ONE row:
             (1) .ctrl-selectors  Symbol · Interval · Profile  (fit-content;
                 labels hide < 760px, the controls stay self-explanatory).
             (2) .ctrl-buttons    Reload (Charts) · Analyze split-button.
             The old .controls-primary / .controls-end split is retired. -->
        <div class="controls" id="controlsBar">
          <!-- ===== Selectors group ===== -->
          <div class="ctrl-selectors">
            <div class="ctrl-field" id="symbolField">
              <label id="symbolLabel">Symbol</label>
              <div class="symbol-select" id="symbolSelect">
                <button type="button" class="symbol-trigger" id="symbolTrigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="symbolLabel symbolTrigger">
                  <span class="sym-logo" id="triggerLogo"></span>
                  <span class="sym-ticker" id="triggerTicker">&mdash;</span>
                  <span class="caret">&#x25BC;</span>
                </button>
                <div class="symbol-panel" id="symbolPanel">
                  <div id="symbolOptions" role="listbox" aria-labelledby="symbolLabel"></div>
                </div>
              </div>
            </div>

            <!-- Interval sets the analysis timeframe; shown in both workspaces. -->
            <div class="ctrl-field interval-field" id="intervalField">
              <label for="intervalSelect">Interval</label>
              <div class="select-wrap">
                <select id="intervalSelect">
                  <option value="1">1m</option>
                  <option value="5">5m</option>
                  <option value="15">15m</option>
                  <option value="30">30m</option>
                  <option value="60" selected>1h</option>
                  <option value="240">4h</option>
                  <option value="D">D</option>
                </select>
              </div>
            </div>

            <!-- Profile: a native dropdown in the same visual language as
                     Symbol/Interval (KEEN only). -->
            <div class="ctrl-field profile-field" id="profileField">
              <label for="profileSelect">Profile</label>
              <div class="select-wrap">
                <select id="profileSelect">
                  <option value="conservative">Conservative</option>
                  <option value="balanced" selected>Balanced</option>
                  <option value="aggressive">Aggressive</option>
                  <option value="research_structure_only">Structure</option>
                  <option value="research_trend_following">Trend</option>
                </select>
              </div>
            </div>
          </div>

          <!-- ===== Buttons group ===== -->
          <div class="ctrl-buttons">
            <button type="button" id="reloadBtn" aria-label="Reload chart" title="Reload chart">
              <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            </button>

            <!-- Trader/Analyst radiogroup — kept as the source of truth for
                     QT.card mode + persistence; visually hidden because the split
                     Analyze menu now drives it. -->
            <div class="qtw-mode-toggle" role="radiogroup" aria-label="Analysis detail mode" hidden>
              <input type="radio" id="modeTrader" name="uiMode" value="trader" />
              <label for="modeTrader">Trader</label>
              <input type="radio" id="modeAnalyst" name="uiMode" value="analyst" />
              <label for="modeAnalyst">Analyst</label>
            </div>

            <!-- Analyze split/multi-action button: main = Analyze, caret opens
                     the analysis-detail-mode menu. Collapses to icon-only < 620px. -->
            <div class="analyze-split" id="analyzeSplit">
              <button type="button" id="analyzeBtn" class="analyze-main" title="Analyze">
                <i class="fa-solid fa-bolt analyze-icon" aria-hidden="true"></i>
                <span class="analyze-text">Analyze</span>
              </button>
              <button type="button" id="analyzeMenuBtn" class="analyze-caret" aria-haspopup="menu" aria-expanded="false" aria-label="Choose analysis detail mode">
                <i class="fa-solid fa-angles-down" aria-hidden="true"></i>
              </button>
              <div class="analyze-menu" id="analyzeMenu" role="menu" aria-label="Analysis detail mode">
                <button type="button" class="analyze-mode" role="menuitemradio" data-mode="trader" aria-checked="true">
                  <i class="fa-solid fa-check am-check" aria-hidden="true"></i>
                  <span class="am-name">Trader</span>
                  <span class="am-desc">Decision-focused</span>
                </button>
                <button type="button" class="analyze-mode" role="menuitemradio" data-mode="analyst" aria-checked="false">
                  <i class="fa-solid fa-check am-check" aria-hidden="true"></i>
                  <span class="am-name">Analyst</span>
                  <span class="am-desc">Full engine output</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="app-body">
        <!-- Workspace 1: Charts — the chart is the dominant component -->
        <section class="workspace workspace--charts" id="wsPanelCharts" role="tabpanel" aria-label="Charts workspace">
          <div class="chart-panel">
            <div class="chart-host" id="chartHost"></div>
          </div>

          <!-- Ticker Bar (bottom): TradingView ticker-tape widget is mounted here -->
          <div class="ticker-bar">
            <div class="tradingview-widget-container" id="tickerTape">
              <div class="tradingview-widget-container__widget"></div>
            </div>
          </div>
        </section>

        <!-- Workspace 2: KEEN — the AI decision center -->
        <section class="workspace workspace--KEEN" id="wsPanelKEEN" role="tabpanel" aria-label="KEEN workspace">
          <div class="analysis-scroll">
            <!-- Quantitative analysis output (rendered by qt-card.js) -->
            <div class="analysis-area">
              <div id="analysisCard" class="qt-card-host" aria-live="polite">
                <!-- Welcoming empty state; replaced by qt-card.js on first analysis. -->
                <div class="qtw-empty">
                  <div class="qtw-empty-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></div>
                  <strong>KEEN is ready</strong>
                  <p>Pick a symbol and timeframe above, then press Analyze. The full recommendation &mdash; trade setup, evidence, qualification gates and risk breakdown &mdash; appears here.</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Small footer: copyright + disclaimer link (pinned to the app shell bottom). -->
      <footer class="app-footer">
        <span class="foot-links">
          <a href="disclaimer.html">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            Disclaimer
          </a>
          <a href="https://hayyaak.com/" target="_blank" rel="noopener">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            2025 &copy; hayyaak.com
          </a>
        </span>
      </footer>
    </div>

    <!-- Transient status toast — e.g. Save-Profile on/off feedback so the toggle's
       effect is unmistakable. aria-live announces it to assistive tech. -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- The chart now uses TradingView's maintained embed-widget pipeline
         (mounted per-render in renderChart), the same family as the ticker-tape.
         The legacy s3.tradingview.com/tv.js library was removed: its
         `new TradingView.widget()` embed is deprecated and prone to freezing
         with no live data as TradingView rotates its chart backends. -->

    <!-- Quantitative analysis engine (load order matters: each builds on the last) -->
    <script src="engine/qt-config.js"></script>
    <script src="engine/qt-utils.js"></script>
    <script src="engine/qt-indicators.js"></script>
    <script src="engine/qt-detection.js"></script>
    <script src="engine/qt-candles.js"></script>
    <script src="engine/qt-structure.js"></script>
    <script src="engine/qt-chart-patterns.js"></script>
    <script src="engine/qt-patterns.js"></script>
    <script src="engine/qt-trend.js"></script>
    <script src="engine/qt-levels.js"></script>
    <script src="engine/qt-risk.js"></script>
    <script src="engine/qt-sentiment.js"></script>
    <script src="engine/qt-profiles.js"></script>
    <script src="engine/qt-scoring.js"></script>
    <script src="engine/qt-recommendation.js"></script>
    <script src="engine/qt-card.js"></script>
    <script src="engine/qt-app.js"></script>

    <script>
      'use strict';

      // ---------------------------------------------------------------
      // Configuration - single source of truth for ticker, selector, chart
      // ---------------------------------------------------------------
      const PAIRS = [
        // Coinbase BTCUSD is true Bitcoin / US Dollar spot (BINANCE:BTCUSDT quotes in Tether, not USD).
        { symbol: 'COINBASE:BTCUSD', label: 'BTC / USD', base: 'BTC', quote: 'USD', category: 'crypto' },
        { symbol: 'OANDA:XAUUSD', label: 'XAU / USD', base: 'XAU', quote: 'USD', category: 'metal' },
        { symbol: 'FX:EURUSD', label: 'EUR / USD', base: 'EUR', quote: 'USD', category: 'forex' },
        { symbol: 'FX:GBPUSD', label: 'GBP / USD', base: 'GBP', quote: 'USD', category: 'forex' },
        { symbol: 'FX:USDJPY', label: 'USD / JPY', base: 'USD', quote: 'JPY', category: 'forex' },
        { symbol: 'FX:AUDUSD', label: 'AUD / USD', base: 'AUD', quote: 'USD', category: 'forex' },
        { symbol: 'FX:GBPJPY', label: 'GBP / JPY', base: 'GBP', quote: 'JPY', category: 'forex' },
        { symbol: 'FX:USDCAD', label: 'USD / CAD', base: 'USD', quote: 'CAD', category: 'forex' },
        { symbol: 'FX:NZDUSD', label: 'NZD / USD', base: 'NZD', quote: 'USD', category: 'forex' },
        { symbol: 'FX:USDCHF', label: 'USD / CHF', base: 'USD', quote: 'CHF', category: 'forex' },
        { symbol: 'FX:EURAUD', label: 'EUR / AUD', base: 'EUR', quote: 'AUD', category: 'forex' },
      ];

      // TradingView's public symbol-logo CDN
      const LOGO_BASE = 'https://s3-symbol-logo.tradingview.com';
      const COUNTRY_OF = {
        USD: 'US',
        EUR: 'EU',
        GBP: 'GB',
        JPY: 'JP',
        AUD: 'AU',
        CAD: 'CA',
        NZD: 'NZ',
        CHF: 'CH',
      };
      const ASSET_LOGO = {
        BTC: LOGO_BASE + '/crypto/XTVCBTC.svg',
        XAU: LOGO_BASE + '/metal/gold.svg',
      };

      function logoUrl(code) {
        if (ASSET_LOGO[code]) return ASSET_LOGO[code];
        if (COUNTRY_OF[code]) return LOGO_BASE + '/country/' + COUNTRY_OF[code] + '.svg';
        return null;
      }

      // Builds the base+quote logo pair; falls back to a text badge if an image fails.
      function buildLogo(pair) {
        const wrap = document.createElement('span');
        wrap.className = 'sym-logo';
        [pair.base, pair.quote].forEach((code) => {
          const url = logoUrl(code);
          if (!url) {
            wrap.appendChild(fallbackBadge(code));
            return;
          }
          // Not lazy-loaded: the dropdown panel starts display:none, so lazy
          // images there would only fetch on first open and visibly pop in.
          const img = document.createElement('img');
          img.src = url;
          img.alt = code;
          img.addEventListener(
            'error',
            () => {
              if (img.parentNode) img.parentNode.replaceChild(fallbackBadge(code), img);
            },
            { once: true }
          );
          wrap.appendChild(img);
        });
        return wrap;
      }

      function fallbackBadge(code) {
        const span = document.createElement('span');
        span.className = 'sym-fallback';
        span.title = code;
        span.textContent = code.slice(0, 3);
        return span;
      }

      // ---------------------------------------------------------------
      // Clock - Kuwait time (UTC+3, no DST), 12-hour, h:mm AM/PM (no seconds)
      // ---------------------------------------------------------------
      const clockEl = document.getElementById('clock');
      let kuwaitFormatter = null;
      try {
        kuwaitFormatter = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Asia/Kuwait',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true,
        });
      } catch (err) {
        kuwaitFormatter = null; // fall back to fixed-offset arithmetic below
      }

      function kuwaitTime() {
        const now = new Date();
        if (kuwaitFormatter) return kuwaitFormatter.format(now);
        // Kuwait observes no DST, so a fixed +03:00 shift is exact.
        const shifted = new Date(now.getTime() + 3 * 60 * 60 * 1000);
        let h = shifted.getUTCHours();
        const suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        const pad = (n) => String(n).padStart(2, '0');
        return h + ':' + pad(shifted.getUTCMinutes()) + ' ' + suffix;
      }

      // Full day + date in Kuwait time, formatted "Monday 27 Jul 2026".
      function kuwaitDate() {
        const now = new Date();
        try {
          const o = { timeZone: 'Asia/Kuwait' };
          return (
            now.toLocaleDateString('en-GB', Object.assign({ weekday: 'long' }, o)) +
            ' ' +
            now.toLocaleDateString('en-GB', Object.assign({ day: 'numeric' }, o)) +
            ' ' +
            now.toLocaleDateString('en-GB', Object.assign({ month: 'short' }, o)) +
            ' ' +
            now.toLocaleDateString('en-GB', Object.assign({ year: 'numeric' }, o))
          );
        } catch (e) {
          return now.toDateString();
        }
      }
      var clockPopEl = document.getElementById('clockPop');
      function updateClock() {
        clockEl.textContent = kuwaitTime();
        if (clockPopEl) clockPopEl.textContent = kuwaitDate(); // keep fresh across midnight
      }
      // Tap-to-toggle for touch devices (hover/focus are handled in CSS).
      (function wireClock() {
        var wrap = document.getElementById('clockWrap');
        if (!wrap) return;
        wrap.addEventListener('click', function () {
          var open = wrap.classList.toggle('open');
          wrap.setAttribute('aria-expanded', String(open));
        });
        wrap.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            wrap.click();
          }
          if (e.key === 'Escape') {
            wrap.classList.remove('open');
            wrap.setAttribute('aria-expanded', 'false');
          }
        });
        document.addEventListener('click', function (e) {
          if (!wrap.contains(e.target)) {
            wrap.classList.remove('open');
            wrap.setAttribute('aria-expanded', 'false');
          }
        });
      })();

      // ---------------------------------------------------------------
      // Ticker tape widget - mounted into the top ticker bar
      // ---------------------------------------------------------------
      let tickerWatchdog = null;
      let tickerRetries = 0;
      function mountTickerTape() {
        const wrap = document.getElementById('tickerTape');
        const container = wrap && wrap.querySelector('.tradingview-widget-container__widget');
        if (!container) return;

        // Idempotent: clear any prior render so a re-mount can't stack two
        // scripts (a known cause of the tape rendering blank / disappearing).
        container.innerHTML = '';
        const stale = wrap.querySelector('script[data-ticker]');
        if (stale) stale.remove();

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
        script.async = true;
        script.setAttribute('data-ticker', '1');
        script.textContent = JSON.stringify({
          symbols: PAIRS.map((p) => ({ proName: p.symbol, title: p.label.replace(/\s/g, '') })),
          showSymbolLogo: true,
          // Transparent mode falls back to a WHITE background in the tape's
          // narrow/stacked layout, so let the widget paint its own dark theme.
          isTransparent: false,
          displayMode: 'adaptive',
          colorTheme: 'dark',
          locale: 'en',
        });
        // The embed script renders into its own parent element.
        container.parentNode.appendChild(script);

        // Watchdog: the embed occasionally fails to paint (script blocked, or
        // it initialised while the Charts panel was hidden and sized to 0).
        // If no iframe appears, re-mount once so the tape isn't left empty.
        if (tickerWatchdog) clearTimeout(tickerWatchdog);
        tickerWatchdog = setTimeout(function () {
          if (!container.querySelector('iframe') && tickerRetries < 2) {
            tickerRetries++;
            mountTickerTape();
          }
        }, 4000);
      }

      // ---------------------------------------------------------------
      // Live quote inside Trade Setup (under the Key Levels ladder)
      // ---------------------------------------------------------------
      // The engine renders an empty .qtw-live-quote slot carrying the symbol;
      // all TradingView wiring stays here, so the engine never touches vendor
      // code or the network. Same idempotent-clear + watchdog shape as the
      // ticker tape, for the same reason: the embed occasionally fails to
      // paint when it initialises inside a hidden or zero-sized container.
      //
      // This is DISPLAY ONLY and REFERENCE ONLY. The widget is a cross-origin
      // iframe, so nothing in this page can read the price out of it — never
      // build logic on it. It sits beside the ladder purely so a reader can
      // compare the live number against Entry/Stop/Targets without scrolling
      // up to the hero.
      let liveQuoteWatchdog = null;
      function mountLiveQuote(root) {
        const slot = root && root.querySelector('.qtw-live-quote');
        if (!slot) return;
        const symbol = slot.getAttribute('data-tv-symbol');
        if (!symbol) return;

        slot.innerHTML = '';
        const container = document.createElement('div');
        container.className = 'tradingview-widget-container';
        const widgetDiv = document.createElement('div');
        widgetDiv.className = 'tradingview-widget-container__widget';
        container.appendChild(widgetDiv);
        slot.appendChild(container);

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
        script.async = true;
        script.textContent = JSON.stringify({
          symbol: symbol,
          width: '100%',
          // isTransparent:true makes this widget fall back to a WHITE
          // background, which tears a bright block through the dark card.
          // Letting it paint its own dark theme is the same workaround the
          // ticker tape already needs, for the same reason.
          isTransparent: false,
          colorTheme: 'dark',
          locale: 'en',
        });
        container.appendChild(script);

        // If it never paints (blocked by a privacy extension, offline, …)
        // remove the WHOLE wrap — label included — rather than leaving an
        // empty band with a "Live Price" heading over nothing. The ladder
        // and Ref. Close still cover the price, so nothing is lost — and no
        // error is logged, because a blocked telemetry/widget host is the
        // user's choice, not a fault of this page.
        if (liveQuoteWatchdog) clearTimeout(liveQuoteWatchdog);
        liveQuoteWatchdog = setTimeout(function () {
          if (!slot.querySelector('iframe')) {
            const wrap = slot.closest('.qtw-live-quote-wrap');
            (wrap || slot).remove();
          }
        }, 5000);
      }

      // ---------------------------------------------------------------
      // Custom symbol selector
      // ---------------------------------------------------------------
      const selectEl = document.getElementById('symbolSelect');
      const triggerEl = document.getElementById('symbolTrigger');
      const optionsEl = document.getElementById('symbolOptions');
      const triggerLogo = document.getElementById('triggerLogo');
      const triggerTicker = document.getElementById('triggerTicker');

      let activeIndex = 0; // currently selected pair
      let hoverIndex = 0; // keyboard-highlighted option

      function buildOptions() {
        optionsEl.innerHTML = '';
        PAIRS.forEach((pair, i) => {
          const opt = document.createElement('div');
          opt.className = 'symbol-option';
          opt.setAttribute('role', 'option');
          opt.dataset.index = String(i);
          opt.setAttribute('aria-selected', String(i === activeIndex));
          opt.id = 'symbol-option-' + i;

          opt.appendChild(buildLogo(pair));

          // Simplified: just the pair label. The symbol code and category
          // added no real value to selection and made the list busy.
          const ticker = document.createElement('span');
          ticker.className = 'opt-ticker';
          ticker.textContent = pair.label;
          opt.appendChild(ticker);

          opt.addEventListener('click', () => selectPair(i));
          opt.addEventListener('mousemove', () => setHover(i));
          optionsEl.appendChild(opt);
        });
      }

      function optionEls() {
        return Array.from(optionsEl.querySelectorAll('.symbol-option'));
      }

      // scrollIntoView is missing in some non-browser/older environments.
      function scrollOptionIntoView(el) {
        if (el && typeof el.scrollIntoView === 'function') {
          el.scrollIntoView({ block: 'nearest' });
        }
      }

      function setHover(i) {
        hoverIndex = i;
        optionEls().forEach((el) => {
          el.classList.toggle('active', Number(el.dataset.index) === i);
        });
      }

      function renderTrigger() {
        const pair = PAIRS[activeIndex];
        triggerLogo.innerHTML = '';
        triggerLogo.appendChild(buildLogo(pair));
        triggerTicker.textContent = pair.label;
        triggerEl.title = pair.label + '  (' + pair.symbol + ')';
      }

      function openPanel() {
        selectEl.classList.add('open');
        triggerEl.setAttribute('aria-expanded', 'true');
        setHover(activeIndex);
        scrollOptionIntoView(optionEls()[activeIndex]);
        // Focus stays on the trigger; arrow/enter keydown bubbles to selectEl.
      }

      function closePanel(refocus) {
        selectEl.classList.remove('open');
        triggerEl.setAttribute('aria-expanded', 'false');
        if (refocus) triggerEl.focus();
      }

      function selectPair(i) {
        const changed = i !== activeIndex;
        activeIndex = i;
        optionEls().forEach((el) => {
          el.setAttribute('aria-selected', String(Number(el.dataset.index) === i));
        });
        renderTrigger();
        closePanel(true);
        if (changed) renderChart();
        savePref('qt.symbol', PAIRS[activeIndex].symbol);
      }

      triggerEl.addEventListener('click', () => {
        if (selectEl.classList.contains('open')) {
          closePanel(false);
        } else {
          openPanel();
        }
      });

      selectEl.addEventListener('keydown', (e) => {
        const open = selectEl.classList.contains('open');
        if (!open) {
          if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPanel();
          }
          return;
        }

        if (e.key === 'Escape') {
          e.preventDefault();
          closePanel(true);
          return;
        }

        const vis = optionEls();
        if (!vis.length) return;
        const pos = vis.findIndex((el) => Number(el.dataset.index) === hoverIndex);

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          const next = vis[Math.min(pos + 1, vis.length - 1)] || vis[0];
          setHover(Number(next.dataset.index));
          scrollOptionIntoView(next);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = vis[Math.max(pos - 1, 0)] || vis[0];
          setHover(Number(prev.dataset.index));
          scrollOptionIntoView(prev);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (pos !== -1) selectPair(hoverIndex);
        }
      });

      document.addEventListener('click', (e) => {
        if (!selectEl.contains(e.target)) closePanel(false);
      });

      // ---------------------------------------------------------------
      // Active chart
      // ---------------------------------------------------------------
      const chartHost = document.getElementById('chartHost');
      let widgetSeq = 0;

      function showChartMessage(text, isError) {
        chartHost.innerHTML = '';
        const msg = document.createElement('div');
        msg.className = 'chart-message' + (isError ? ' error' : '');
        msg.textContent = text;
        chartHost.appendChild(msg);
      }

      // Mounts TradingView's maintained Advanced Chart embed. Unlike the
      // legacy `new TradingView.widget()` (which froze with no live feed as
      // TradingView rotated backends), this widget self-loads its script and
      // data pipeline per render — the same mechanism as the working ticker.
      function renderChart() {
        const pair = PAIRS[activeIndex];

        // Tear down the previous widget completely — a stale container keeps
        // the old iframe (and its dead socket) around, which reads as a freeze.
        chartHost.innerHTML = '';
        widgetSeq++;

        const container = document.createElement('div');
        container.className = 'tradingview-widget-container';
        container.style.width = '100%';
        container.style.height = '100%';
        const widgetDiv = document.createElement('div');
        widgetDiv.className = 'tradingview-widget-container__widget';
        widgetDiv.style.width = '100%';
        widgetDiv.style.height = '100%';
        container.appendChild(widgetDiv);
        chartHost.appendChild(container);

        try {
          const script = document.createElement('script');
          script.type = 'text/javascript';
          script.async = true;
          script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
          // The embed reads its config from the script's text content.
          script.textContent = JSON.stringify({
            symbol: pair.symbol,
            interval: document.getElementById('intervalSelect').value,
            timezone: 'Etc/UTC',
            theme: 'dark',
            // Chart style/interval are owned by the widget's own toolbar
            // now; candles (1) is the mount default.
            style: '1',
            locale: 'en',
            enable_publishing: false,
            allow_symbol_change: false,
            hide_side_toolbar: false,
            calendar: false,
            studies: ['MASimple@tv-basicstudies'],
            support_host: 'https://www.tradingview.com',
            autosize: true,
            backgroundColor: '#1a1a2e',
            gridColor: '#1e1e35',
          });
          // If the embed script itself fails to load (blocked/offline),
          // surface an actionable message instead of a silent blank frame.
          script.addEventListener(
            'error',
            function () {
              showChartMessage('Chart failed to load for ' + pair.label + '. If you use a privacy/ad blocker (e.g. Brave Shields), allow tradingview.com for this site, then Reload.', true);
            },
            { once: true }
          );
          container.appendChild(script);
        } catch (err) {
          console.error('TradingView widget failed:', err);
          showChartMessage('Unable to render the chart for ' + pair.label + '.', true);
        }
      }

      document.getElementById('intervalSelect').addEventListener('change', renderChart);
      document.getElementById('reloadBtn').addEventListener('click', renderChart);

      // ---------------------------------------------------------------
      // Two-workspace switching (Charts / KEEN) — presentation only.
      // A pure attribute flip, persisted to localStorage. Both panels stay
      // mounted, so switching never reloads the chart or re-runs the engine.
      // A single icon button toggles between the two: the icon shown is the
      // CURRENT workspace's icon, and the label always names the destination.
      // ---------------------------------------------------------------
      var appEl = document.getElementById('app');
      var WS_KEY = 'qt.workspace';
      var wsToggle = document.getElementById('wsToggle');
      var wsToggleIcon = document.getElementById('wsToggleIcon');
      var WS_ICON = { charts: 'fa-chart-line', KEEN: 'fa-magnifying-glass-dollar' }; // chart / eye (FontAwesome)

      function setWorkspace(ws) {
        ws = ws === 'KEEN' ? 'KEEN' : 'charts';
        appEl.setAttribute('data-workspace', ws);
        if (wsToggle) {
          var next = ws === 'charts' ? 'KEEN' : 'charts';
          var nextLabel = next === 'charts' ? 'Charts' : 'KEEN';
          wsToggle.setAttribute('aria-pressed', String(ws === 'KEEN'));
          wsToggle.setAttribute('aria-label', 'Switch to ' + nextLabel);
          wsToggle.title = 'Switch to ' + nextLabel;
          if (wsToggleIcon) wsToggleIcon.className = 'fa-solid ' + WS_ICON[ws];
        }
        // Only persist the workspace when Save Profile is Active.
        if (profileSaveEnabled) {
          try {
            localStorage.setItem(WS_KEY, ws);
          } catch (e) {
            /* storage may be unavailable */
          }
        }
        // TradingView autosizes on resize; nudge it when the chart reappears.
        if (ws === 'charts') {
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event('resize'));
          });
        }
      }

      function wireWorkspaceSwitch() {
        // Brand acts as "home": clicking (or Enter/Space on) the KEEN
        // wordmark jumps straight to the Charts workspace, the app's home view.
        var brand = document.getElementById('brandHome');
        if (brand) {
          var goCharts = function () {
            if (appEl.getAttribute('data-workspace') !== 'charts') {
              setWorkspace('charts');
              tickerRetries = 0;
              mountTickerTape();
            }
          };
          brand.addEventListener('click', goCharts);
          brand.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              goCharts();
            }
          });
        }
        if (!wsToggle) return;
        wsToggle.addEventListener('click', function () {
          var goingTo = appEl.getAttribute('data-workspace') === 'charts' ? 'KEEN' : 'charts';
          setWorkspace(goingTo);
          // Ticker-bar stability: the tape is a TradingView iframe living inside
          // the Charts panel. While that panel is display:none (in KEEN) the
          // embed can blank or freeze — and unlike the advanced chart, a plain
          // resize nudge does not always revive the tape. Re-mount it on every
          // return to Charts so it is always freshly sized and painted. The mount
          // is idempotent (it clears any prior render first), so this cannot stack
          // scripts; retries reset so the watchdog stays available.
          if (goingTo === 'charts') {
            tickerRetries = 0;
            mountTickerTape();
          }
        });
      }

      // ---- Save-profile toggle ----
      // Its OWN ON/OFF state is always persisted (under SAVE_PROFILE_KEY) so the
      // choice survives reloads. When ON it is the master switch that lets every
      // other setting persist and restore; when OFF the app opens in defaults.
      // Icon is full brightness when ON, dimmed when OFF (see #saveProfileBtn CSS).
      var SAVE_PROFILE_KEY = 'qt.profileSaveEnabled';
      var profileSaveEnabled = false; // authoritative gate (set in Init before restorePrefs)
      var saveProfileBtn = document.getElementById('saveProfileBtn');

      // Transient toast so the Save-Profile toggle's effect is unmistakable —
      // the #1 reason users think persistence "isn't working" is not realising
      // it is off by default and gives no feedback when clicked.
      var toastEl = document.getElementById('toast');
      var toastTimer = null;
      function showToast(msg, kind) {
        if (!toastEl) return;
        toastEl.className = 'toast' + (kind ? ' toast-' + kind : '');
        toastEl.innerHTML = '';
        var i = document.createElement('i');
        i.className = 'fa-solid ' + (kind === 'on' ? 'fa-floppy-disk' : kind === 'off' ? 'fa-ban' : 'fa-circle-info');
        i.setAttribute('aria-hidden', 'true');
        toastEl.appendChild(i);
        toastEl.appendChild(document.createTextNode(msg));
        toastEl.hidden = false;
        requestAnimationFrame(function () {
          toastEl.classList.add('show');
        });
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
          setTimeout(function () {
            toastEl.hidden = true;
          }, 300);
        }, 3200);
      }

      function setSaveProfile(on, capture) {
        profileSaveEnabled = !!on; // update the gate first so savePref() can write
        if (!saveProfileBtn) return;
        saveProfileBtn.setAttribute('aria-pressed', String(on));
        saveProfileBtn.title = on ? 'Profile preferences: saving' : 'Profile preferences: not saving';
        saveProfileBtn.setAttribute('aria-label', saveProfileBtn.title);
        // The toggle's own state is stored unconditionally (not gated by itself).
        try {
          localStorage.setItem(SAVE_PROFILE_KEY, on ? '1' : '0');
        } catch (e) {
          /* storage may be unavailable */
        }
        // On a user turning it ON, snapshot the present UI so it is remembered.
        if (on && capture) persistCurrentSettings();
        // Only announce on an actual user action (capture=true), not on the
        // silent reflect-state call during Init.
        if (capture) {
          showToast(on ? 'Saving your settings — symbol, interval, profile, workspace & mode will be restored next visit.' : 'Not saving — the dashboard will open in its defaults.', on ? 'on' : 'off');
        }
      }
      function wireSaveProfile() {
        if (!saveProfileBtn) return;
        // Reflect the already-read gate into the button; do not re-capture here.
        setSaveProfile(profileSaveEnabled, false);
        saveProfileBtn.addEventListener('click', function () {
          setSaveProfile(saveProfileBtn.getAttribute('aria-pressed') !== 'true', true);
        });
      }

      // ---- Connection indicator in the header (real observed state only) ----
      // Pulse dot only; the state text is exposed via the chip's title/aria-label.
      var connDot = document.getElementById('connDot');
      var connChip = document.getElementById('connChip');
      function setConn(state, message) {
        if (connDot) {
          connDot.classList.remove('is-loading', 'is-ok', 'is-error');
          if (state === 'loading') connDot.classList.add('is-loading');
          else if (state === 'ok') connDot.classList.add('is-ok');
          else if (state === 'error') connDot.classList.add('is-error');
        }
        if (connChip) {
          var label = state === 'loading' ? 'Connecting…' : state === 'ok' ? 'Connected' : state === 'error' ? 'Unreachable' : 'Idle';
          var full = 'Analysis proxy connection: ' + label + (message ? ' — ' + message : '');
          connChip.title = full;
          connChip.setAttribute('aria-label', full);
        }
      }

      // Proactively reflect the REAL proxy state instead of sitting at "Idle".
      // Probes /api/v1/health on load and on an interval, and skips while an
      // Analyze run owns the indicator (analysisInFlight) so it isn't clobbered.
      var analysisInFlight = false;
      function probeConnection() {
        if (analysisInFlight) return;
        if (!window.QT || !QT.app || typeof QT.app.checkHealth !== 'function') {
          setConn('idle');
          return;
        }
        QT.app.checkHealth().then(function (h) {
          if (analysisInFlight) return; // an Analyze run started meanwhile
          if (h && h.ok) {
            setConn('ok', 'Proxy healthy' + (h.status && h.status !== 'ok' ? ' (' + h.status + ')' : '') + '.');
          } else {
            setConn('error', 'Proxy unreachable — start it / enable the IIS reverse proxy.');
          }
        });
      }

      // ---------------------------------------------------------------
      // Session persistence — reopen exactly as the user left it. Symbol,
      // interval and profile join the already-persisted workspace and
      // Trader/Analyst mode. (Chart style is no longer persisted — the
      // TradingView toolbar owns it.) Presentation state only.
      // ---------------------------------------------------------------
      var PREF = { symbol: 'qt.symbol', interval: 'qt.interval', profile: 'qt.profile' };
      // Persistence is OFF by default: the app always opens in its default
      // configuration. Only when the Save-Profile icon is Active does it both
      // persist changes and restore the last custom settings on next load.
      // `profileSaveEnabled` is the single gate; it is read from storage at the
      // very top of Init (before restorePrefs) and kept in sync by setSaveProfile.
      function savePref(k, v) {
        if (!profileSaveEnabled) return; // no writes unless Save Profile is Active
        try {
          localStorage.setItem(k, v);
        } catch (e) {
          /* storage may be unavailable */
        }
      }
      function loadPref(k) {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return null;
        }
      }
      function setSelectValue(id, val) {
        var sel = document.getElementById(id);
        if (!sel || val == null) return;
        var ok = Array.prototype.some.call(sel.options, function (o) {
          return o.value === val;
        });
        if (ok) sel.value = val;
      }
      function restorePrefs() {
        if (!profileSaveEnabled) return; // defaults unless Save Profile is Active
        var sym = loadPref(PREF.symbol);
        if (sym) {
          for (var i = 0; i < PAIRS.length; i++) {
            if (PAIRS[i].symbol === sym) {
              activeIndex = i;
              break;
            }
          }
        }
        setSelectValue('intervalSelect', loadPref(PREF.interval));
        setSelectValue('profileSelect', loadPref(PREF.profile));
      }
      // Snapshot the current UI into storage — used the moment the user turns
      // the toggle ON, so "save from now on" captures the present state too.
      function persistCurrentSettings() {
        savePref(PREF.symbol, PAIRS[activeIndex].symbol);
        var iv = document.getElementById('intervalSelect');
        var pf = document.getElementById('profileSelect');
        if (iv) savePref(PREF.interval, iv.value);
        if (pf) savePref(PREF.profile, pf.value);
        if (profileSaveEnabled) {
          try {
            localStorage.setItem(WS_KEY, appEl.getAttribute('data-workspace') || 'charts');
          } catch (e) {}
          try {
            if (window.QT && QT.card) localStorage.setItem('qt.uiMode', QT.card.getMode());
          } catch (e) {}
        }
      }
      function wirePrefPersistence() {
        var iv = document.getElementById('intervalSelect');
        var pf = document.getElementById('profileSelect');
        if (iv)
          iv.addEventListener('change', function () {
            savePref(PREF.interval, iv.value);
          });
        if (pf)
          pf.addEventListener('change', function () {
            savePref(PREF.profile, pf.value);
          });
      }

      // ---------------------------------------------------------------
      // Analyze split-button menu — the caret opens a menu of analysis detail
      // modes (Trader / Analyst). Selecting one drives the hidden #modeTrader/
      // #modeAnalyst radiogroup (still the source of truth for QT.card + save),
      // so all existing mode wiring keeps working. The current mode is reflected
      // back into the menu (checkmark) and the split button's title.
      // ---------------------------------------------------------------
      function wireAnalyzeSplit() {
        var split = document.getElementById('analyzeSplit');
        var caretBtn = document.getElementById('analyzeMenuBtn');
        var menu = document.getElementById('analyzeMenu');
        if (!split || !caretBtn || !menu) return;
        var modeItems = menu.querySelectorAll('.analyze-mode');

        function reflectMode() {
          var mode = window.QT && QT.card ? QT.card.getMode() : 'trader';
          Array.prototype.forEach.call(modeItems, function (mi) {
            mi.setAttribute('aria-checked', String(mi.dataset.mode === mode));
          });
          var main = document.getElementById('analyzeBtn');
          if (main) main.title = 'Analyze · ' + (mode === 'analyst' ? 'Analyst' : 'Trader') + ' detail';
        }
        function closeMenu() {
          split.classList.remove('open');
          caretBtn.setAttribute('aria-expanded', 'false');
        }
        caretBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = split.classList.toggle('open');
          caretBtn.setAttribute('aria-expanded', String(open));
          if (open) reflectMode();
        });
        Array.prototype.forEach.call(modeItems, function (mi) {
          mi.addEventListener('click', function () {
            // Drive the authoritative radio so QT.card + persistence update.
            var radio = document.getElementById(mi.dataset.mode === 'analyst' ? 'modeAnalyst' : 'modeTrader');
            if (radio) {
              radio.checked = true;
              radio.dispatchEvent(new Event('change', { bubbles: true }));
            }
            reflectMode();
            closeMenu();
          });
        });
        document.addEventListener('click', function (e) {
          if (!split.contains(e.target)) closeMenu();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeMenu();
        });
        reflectMode();
      }

      // ---------------------------------------------------------------
      // Init
      // ---------------------------------------------------------------
      // Read the persistence gate FIRST, so restorePrefs() and every later
      // read honour it. Default (unset/'0') => open in defaults.
      try {
        profileSaveEnabled = localStorage.getItem(SAVE_PROFILE_KEY) === '1';
      } catch (e) {
        profileSaveEnabled = false;
      }
      restorePrefs();
      buildOptions();
      renderTrigger();
      updateClock();
      (function () {
        var y = document.getElementById('footYear');
        if (y) y.textContent = new Date().getFullYear();
      })();
      setInterval(updateClock, 1000);
      mountTickerTape();
      wireWorkspaceSwitch();
      wireSaveProfile();
      wirePrefPersistence();
      wireAnalyzeSplit();
      setConn('loading', 'Checking analysis proxy…');
      probeConnection();
      // Keep the indicator live — re-check the proxy every 60s.
      setInterval(probeConnection, 60000);

      // ---------------------------------------------------------------
      // Trader / Analyst mode toggle — pure display switch (Phase 8.5).
      // QT.card owns the mode state (and its localStorage persistence);
      // this just reflects it into the radio pair and forwards changes.
      // Switching modes never re-fetches, re-analyzes, or re-renders.
      // ---------------------------------------------------------------
      // Restore the saved Trader/Analyst mode only when Save Profile is Active;
      // otherwise force the default (Trader) so the app opens in defaults.
      var modeRadios = document.querySelectorAll('input[name="uiMode"]');
      var initialMode = profileSaveEnabled ? QT.card.getMode() : QT.card.setMode('trader');
      modeRadios.forEach(function (r) {
        r.checked = r.value === initialMode;
        r.addEventListener('change', function () {
          if (this.checked) QT.card.setMode(this.value);
        });
      });

      // ---------------------------------------------------------------
      // Analyze: delegates entirely to the engine; no analysis lives here.
      // ---------------------------------------------------------------
      var analyzeBtn = document.getElementById('analyzeBtn');
      var analysisCard = document.getElementById('analysisCard');
      var profileSelect = document.getElementById('profileSelect');

      analyzeBtn.addEventListener('click', function () {
        // Results render in KEEN — surface it immediately so the user
        // sees the loading state and then the recommendation as it lands.
        setWorkspace('KEEN');
        analysisInFlight = true; // the health probe yields to the Analyze run
        setConn('loading', 'Analyzing ' + PAIRS[activeIndex].label + '…');
        QT.app
          .run({
            symbol: PAIRS[activeIndex].symbol,
            timeframe: document.getElementById('intervalSelect').value,
            profile: profileSelect.value,
            container: analysisCard,
            button: analyzeBtn,
          })
          .then(function (rec) {
            analysisInFlight = false;
            if (rec && rec.recommendation) {
              setConn('ok', 'Analysis ready — ' + rec.recommendation.label + '.');
              // QT.app.run has already rendered the card by now, so the
              // Trade Setup card's quote slot exists and can be filled.
              mountLiveQuote(analysisCard);
            } else {
              setConn('error', 'Analysis failed. See the panel for details.');
            }
          });
      });

      window.addEventListener('load', () => {
        renderChart();
        // Restore the last workspace only after the chart mounts while Charts
        // is visible, so TradingView sizes correctly on first paint.
        var startWs = 'charts';
        if (profileSaveEnabled) {
          try {
            startWs = localStorage.getItem(WS_KEY) || 'charts';
          } catch (e) {
            /* storage may be unavailable */
          }
        }
        setWorkspace(startWs);
      });
    </script>
  </body>
</html>
