<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Live Market Dashboard</title>
    <meta name="theme-color" content="#0f0f1a" />
    <!-- Installable PWA metadata + favicons (locally hosted). -->
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <!-- Locally hosted FontAwesome 7 (icons + self-hosted webfonts under ../webfonts/).
         Replaces all emoji/CDN icons and CDN fonts — fully offline, no external calls. -->
    <link rel="stylesheet" href="assets/fontawesome-free-7.3.1-web/css/all.min.css" />
    <style>
      /* Inter — self-hosted variable font (Latin), no CDN. A single
           weight-axis woff2 covers the whole 100–900 range. `swap` shows the
           system fallback instantly, then upgrades to Inter when it paints. */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('assets/fonts/inter-latin-variable.woff2') format('woff2');
      }
      /* ==============================================================
           Design tokens
           Every dimension below is either fluid (clamp) or measured at
           runtime, so the layout resolves against the real viewport
           rather than hard-coded breakpoint guesses.
           ============================================================== */
      :root {
        color-scheme: dark;

        /* ---- Palette ---- */
        --c-bg: #0f0f1a;
        --c-surface: #12121f;
        --c-surface-2: #1a1a2e;
        --c-surface-3: #14142a;
        --c-elevated: #23234a;
        --c-border: #2a2a4a;
        --c-border-soft: #1e1e35;
        --c-border-hover: #3a3a5f;
        --c-text: #e0e0e0;
        --c-text-strong: #ffffff;
        --c-text-dim: #888888;
        --c-text-faint: #8a8ab2;
        --c-text-muted: #8a8aa4;
        --c-accent: #7b2ff7;
        --c-accent-2: #00d4ff;
        --c-live: #00e676;
        --c-danger: #ff6b6b;

        /* ---- Brand & action palette (WCAG-AA verified) ----
               Replaces the old cyan/purple gradients with a cohesive
               cyan -> indigo -> violet scale.
               • --grad-brand paints clipped display text on the dark shell:
                 cyan #22d3ee ~10:1 and indigo #818cf8 ~7:1 vs --c-bg.
               • --grad-action fills buttons carrying WHITE label text:
                 indigo #4f46e5 gives white 6.3:1 and violet #7c3aed 5.7:1
                 (both clear the 4.5:1 AA threshold for normal text). */
        --c-brand-1: #22d3ee; /* cyan  */
        --c-brand-2: #818cf8; /* indigo (light) */
        --c-action-1: #4f46e5; /* indigo 600 */
        --c-action-2: #7c3aed; /* violet 600 */
        --grad-brand: linear-gradient(90deg, var(--c-brand-1), var(--c-brand-2));
        --grad-action: linear-gradient(135deg, var(--c-action-1), var(--c-action-2));

        /* Distinct, accessible accents for the header FontAwesome icons. */
        --c-ico-chart: #22d3ee; /* cyan   — charts / eye toggle */
        --c-ico-calc: #fbbf24; /* amber  — calculator */
        --c-ico-save: #34d399; /* green  — save profile (when on) */
        --c-ico-valid: #a78bfa; /* violet — strategy validation */

        /* ---- Pixel-aware primitives ----
               --hairline renders a true 1-device-pixel rule (see the HiDPI
               media queries below) instead of a blurry 1px. */
        --hairline: 1px;

        /* ---- Fluid spacing (clamped at both ends) ---- */
        --sp-1: clamp(2px, 0.25vw, 4px);
        --sp-2: clamp(4px, 0.5vw, 8px);
        --sp-3: clamp(7px, 0.85vw, 12px);
        --sp-4: clamp(10px, 1.25vw, 18px);
        --sp-5: clamp(14px, 1.75vw, 26px);

        /* ---- Fluid type ---- */
        --fs-2xs: clamp(0.58rem, 0.52rem + 0.18vw, 0.7rem);
        --fs-xs: clamp(0.68rem, 0.62rem + 0.2vw, 0.8rem);
        --fs-sm: clamp(0.76rem, 0.7rem + 0.22vw, 0.9rem);
        --fs-md: clamp(0.84rem, 0.78rem + 0.25vw, 1rem);
        --fs-lg: clamp(1.05rem, 0.88rem + 0.78vw, 1.5rem);

        /* Controls-bar typography — dynamic (clamp) sizes so labels, selector
               values and buttons scale smoothly from small screens (compact but
               readable) to wide screens (comfortable), preventing overlap/
               truncation. Also gives Arabic localization headroom later. */
        --ctrl-fs-label: clamp(0.56rem, 0.48rem + 0.28vw, 0.72rem);
        --ctrl-fs-value: clamp(0.76rem, 0.66rem + 0.4vw, 0.92rem);
        --ctrl-fs-btn: clamp(0.76rem, 0.66rem + 0.4vw, 0.92rem);

        /* ---- Radii ---- */
        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 8px;

        /* ---- Component sizing ---- */
        --logo-size: clamp(16px, 0.9rem + 0.4vw, 22px);
        --logo-overlap: calc(var(--logo-size) * -0.4);
        --control-h: clamp(28px, 1.5rem + 0.7vw, 36px);
        --symbol-w: clamp(150px, 16vw, 230px);

        /* One arrow spec shared by every selector field */
        --arrow-size: clamp(0.5rem, 0.44rem + 0.18vw, 0.62rem);
        --arrow-gap: var(--sp-3);
        --c-arrow: #8b8bab;
        --panel-max-h: clamp(200px, 42dvh, 420px);
        --dot-size: clamp(6px, 0.5vw, 9px);
      }

      /* True hairline borders on HiDPI displays */
      @media (min-resolution: 1.5dppx) {
        :root {
          --hairline: 0.5px;
        }
      }
      @media (min-resolution: 2.5dppx) {
        :root {
          --hairline: 0.34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }
      body {
        background: var(--c-bg);
        color: var(--c-text);
        font-family: 'Inter Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: var(--fs-md);
        height: 100%;
        /* The app shell (below) owns 100dvh and manages every scroll
               internally, so the browser viewport itself never scrolls. */
        overflow: hidden;
      }

      /* ---------------- Header ---------------- */
      /* Trimmed vertical padding + tighter title keep the chrome compact so the
           chart owns more of the viewport. */
      /* Header is a guaranteed SINGLE row at every width: nowrap, with the brand
           as the only shrink sink (min-width:0 + ellipsis) so the status and the
           fixed action icons never wrap or overflow. */
      .header {
        background: linear-gradient(135deg, var(--c-surface-2) 0%, #16213e 100%);
        padding: var(--sp-3) var(--sp-2) var(--sp-1);
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        flex-wrap: nowrap;
        border-bottom: var(--hairline) solid var(--c-border);
      }
      .header h1 {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .header .status {
        flex: 0 0 auto;
      }
      .header-actions {
        flex: 0 0 auto;
      }

      .header h1 {
        font-size: clamp(1rem, 0.85rem + 0.68vw, 1.35rem);
        font-weight: 600;
        line-height: 1.15;
        background: var(--grad-brand);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Status = live dot + time only. Tight gap so the pair reads as one unit. */
      .header .status {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-size: var(--fs-sm);
        color: var(--c-text-dim);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        white-space: nowrap;
      }

      .header .status .dot {
        width: var(--sp-4);
        height: var(--sp-4);
        background: var(--c-live);
        border-radius: 50%;
        flex: 0 0 auto;
        animation: pulse 2s infinite;
      }

      .header .status #clock {
        color: var(--c-text-strong);
        font-weight: 600;
        letter-spacing: 0.3px;
        line-height: 1;
      }

      /* Clock date popover — reveals the full day + date on hover / focus / tap.
           Absolutely positioned, so it never affects header layout or wrapping. */
      .clock-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
      }
      .clock-pop {
        position: absolute;
        top: calc(100% + 9px);
        left: 0;
        background: var(--c-surface-2);
        color: var(--c-text-strong);
        border: var(--hairline) solid var(--c-border-hover);
        border-radius: var(--r-md);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        padding: var(--sp-2) var(--sp-3);
        font-size: var(--fs-2xs);
        font-weight: 300;
        white-space: nowrap;
        letter-spacing: 0.3px;
        z-index: 60;
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .clock-wrap:hover .clock-pop,
      .clock-wrap:focus-visible .clock-pop,
      .clock-wrap.open .clock-pop {
        opacity: 1;
        transform: translateY(0);
      }
      .clock-wrap:focus-visible {
        outline: 2px solid var(--c-brand-1);
        outline-offset: 2px;
        border-radius: 4px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ---------------- Ticker bar (hosts TradingView ticker-tape) --------- */
      .ticker-bar {
        background: black;
        border-bottom: var(--hairline) solid var(--c-border);
        overflow: hidden;
        min-height: 38px;
      }

      .ticker-bar .tradingview-widget-container,
      .ticker-bar .tradingview-widget-container__widget {
        width: 100%;
      }

      .ticker-bar .tradingview-widget-copyright {
        display: none;
      }

      /* ---------------- Controls ---------------- */
      /* Controls bar: two groups — selectors (left, shrinkable) and buttons
           (right, fixed) — that stay on ONE row (nowrap) at every width. */
      .controls {
        padding: var(--sp-2) var(--sp-5);
        display: flex;
        align-items: center;
        gap: var(--sp-4);
        flex-wrap: nowrap;
        background: black;
        border-bottom: var(--hairline) solid var(--c-border-soft);
      }

      /* Selectors group: sizes to its content and shrinks (min-width:0) so the
           buttons group is never pushed to a new row. */
      .ctrl-selectors {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        width: fit-content;
        min-width: 0;
        flex: 0 1 auto;
      }
      .ctrl-selectors > * {
        min-width: 0;
      }
      .ctrl-field {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-2);
        min-width: 0;
      }
      .interval-field {
        min-width: 0;
      }

      /* Buttons group: fixed size, pinned to the row's end. */
      .ctrl-buttons {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        flex: 0 0 auto;
        margin-left: auto;
      }

      /* ---- Workspace-specific control visibility ----
           Charts is chart-centric (Symbol · Interval · Reload · Analyze); the
           Profile picker is hidden. KEEN drops the chart Reload and surfaces
           Profile. Interval shows in both (it sets the analysis timeframe).
           The Trader/Analyst radiogroup is always hidden — the Analyze split
           menu drives it now. */
      .app[data-workspace='charts'] .profile-field {
        display: none;
      }
      .app[data-workspace='KEEN'] #reloadBtn {
        display: none;
      }
      .qtw-mode-toggle[hidden] {
        display: none;
      }

      /* ---- Analyze split / multi-action button ---- */
      .analyze-split {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
      }
      .analyze-main {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-2);
        height: var(--control-h);
        padding: 0 var(--sp-4);
        border: none;
        border-radius: var(--r-md) 0 0 var(--r-md);
        background: var(--grad-action);
        color: #fff;
        font-weight: 700;
        font-size: var(--ctrl-fs-btn);
        font-family: inherit;
        cursor: pointer;
        transition:
          filter 0.2s,
          opacity 0.2s;
      }
      .analyze-main .analyze-icon {
        font-size: 0.9em;
      }
      .analyze-caret {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 var(--sp-1);
        width: auto;
        height: var(--control-h);
        border: none;
        border-left: var(--hairline) solid rgba(255, 255, 255, 0.25);
        border-radius: 0 var(--r-md) var(--r-md) 0;
        background: linear-gradient(135deg, rgba(0, 184, 147, 0.7), rgba(0, 213, 255, 0.7));
        color: #04121a;
        cursor: pointer;
        transition: filter 0.2s;
      }
      .analyze-main:hover,
      .analyze-caret:hover {
        filter: brightness(1.1);
      }
      .analyze-main:disabled,
      .analyze-split.busy .analyze-caret {
        opacity: 0.5;
        cursor: progress;
      }
      .analyze-caret i {
        transition: transform 0.2s;
      }
      .analyze-split.open .analyze-caret i {
        transform: rotate(180deg);
      }
      .analyze-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 60;
        min-width: 200px;
        padding: var(--sp-2);
        background: var(--c-surface-2);
        border: var(--hairline) solid var(--c-border-hover);
        border-radius: var(--r-md);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
        display: none;
        flex-direction: column;
        gap: 2px;
      }
      .analyze-split.open .analyze-menu {
        display: flex;
      }
      .analyze-mode {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: var(--sp-2);
        background: transparent;
        border: none;
        border-radius: var(--r-sm);
        color: var(--c-text);
        font-size: var(--ctrl-fs-btn);
        font-weight: normal;
        text-align: left;
        cursor: pointer;
      }
      .analyze-mode:hover {
        background: var(--c-elevated);
      }
      .analyze-mode .am-check {
        color: var(--c-brand-1);
        opacity: 0;
        font-size: 0.85em;
      }
      .analyze-mode[aria-checked='true'] .am-check {
        opacity: 1;
      }
      .analyze-mode[aria-checked='true'] .am-name {
        color: var(--c-text-strong);
        font-weight: 700;
      }
      .analyze-mode .am-desc {
        color: var(--c-text-dim);
        font-size: var(--fs-2xs);
      }
      .analyze-main:focus-visible,
      .analyze-caret:focus-visible,
      .analyze-mode:focus-visible {
        outline: 2px solid var(--c-brand-1);
        outline-offset: -2px;
      }

      .controls label {
        font-size: var(--ctrl-fs-label);
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* ---- Unified dropdown arrow ----
           Native select arrows are drawn by the OS and differ per platform, so
           they're suppressed and every field - native selects and the custom
           symbol trigger alike - renders the same U+25BC glyph at the same
           size, colour and optical position. */
      .select-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .select-wrap::after,
      .symbol-trigger .caret {
        font-size: var(--arrow-size);
        line-height: 1;
        color: var(--c-arrow);
        pointer-events: none;
      }

      .select-wrap::after {
        content: '\25BC';
        position: absolute;
        right: var(--arrow-gap);
        top: 50%;
        transform: translateY(-50%);
      }

      .controls select {
        height: var(--control-h);
        background: var(--c-surface-2);
        color: var(--c-text);
        border: var(--hairline) solid var(--c-border);
        /* room on the right for the shared arrow */
        padding: 0 calc(var(--arrow-gap) * 2 + var(--arrow-size)) 0 var(--sp-3);
        border-radius: var(--r-md);
        font-size: var(--ctrl-fs-value);
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }

      .controls select::-ms-expand {
        display: none;
      }

      .controls select:focus-visible {
        outline: none;
        border-color: var(--c-accent);
      }

      /* Scoped to the action button so it can't bleed onto the symbol trigger.
           Icon-only on EVERY screen: a square control that never competes with
           Symbol/Interval for horizontal space. The accessible name lives on
           aria-label (the glyph itself is aria-hidden). */
      .controls #reloadBtn {
        height: var(--control-h);
        width: var(--control-h);
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--grad-action);
        color: var(--c-text-strong);
        border: none;
        padding: 0;
        border-radius: var(--r-md);
        font-size: var(--fs-sm);
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .controls #reloadBtn:hover {
        opacity: 0.85;
      }

      /* ---------------- Symbol logos ---------------- */
      .sym-logo {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
      }

      .sym-logo img,
      .sym-logo .sym-fallback {
        width: var(--logo-size);
        height: var(--logo-size);
        border-radius: 50%;
        background: var(--c-border);
        object-fit: cover;
        display: block;
      }

      .sym-logo .sym-fallback {
        font-size: var(--fs-2xs);
        font-weight: 700;
        color: #cfd3e6;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -0.3px;
      }

      .sym-logo > *:nth-child(2) {
        margin-left: var(--logo-overlap);
        box-shadow: -2px 0 0 0 var(--c-surface-2);
      }

      /* ---------------- Custom symbol selector ---------------- */
      .symbol-select {
        position: relative;
        /* Fit content: the trigger already pads itself; no forced minimum. */
        flex: 0 0 auto;
      }

      .controls .symbol-trigger {
        width: 100%;
        height: var(--control-h);
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        background: var(--c-surface-2);
        color: var(--c-text);
        border: var(--hairline) solid var(--c-border);
        padding: 0 var(--sp-3);
        border-radius: var(--r-md);
        font-size: var(--ctrl-fs-value);
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.2s;
      }

      .symbol-trigger:hover {
        border-color: var(--c-border-hover);
      }

      .symbol-trigger:focus-visible,
      .symbol-select.open .symbol-trigger {
        outline: none;
        border-color: var(--c-accent);
      }

      .symbol-trigger .sym-ticker {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 600;
        color: var(--c-text-strong);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* size/colour come from the shared arrow rule above */
      .symbol-trigger .caret {
        flex: 0 0 auto;
        display: block;
        /* matches the native selects' arrow inset */
        margin-right: calc(var(--arrow-gap) - var(--sp-3));
        transition: transform 0.2s;
      }

      /* Only the custom dropdown can know it is expanded, so only it flips. */
      .symbol-select.open .caret {
        transform: rotate(180deg);
      }

      /* Panel tracks the trigger width but may grow to fit its rows, so the
           option layout never gets crushed when the trigger is narrow. Capped so
           it can't outgrow the viewport. */
      .symbol-panel {
        position: absolute;
        top: calc(100% + var(--sp-2));
        left: 0;
        right: auto;
        min-width: 100%;
        width: max-content;
        max-width: min(340px, calc(100vw - var(--sp-5) * 2));
        background: var(--c-surface-3);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-lg);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        z-index: 1200;
        padding: var(--sp-2);
        max-height: var(--panel-max-h);
        overflow-y: auto;
        overscroll-behavior: contain;
        display: none;
      }

      .symbol-select.open .symbol-panel {
        display: block;
      }

      /* Simplified: logo | pair label. Two roles, nothing else to scan. */
      .symbol-option {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        column-gap: var(--sp-3);
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--r-md);
        cursor: pointer;
        font-size: var(--fs-sm);
      }

      .symbol-option:hover,
      .symbol-option.active {
        background: var(--c-elevated);
      }

      .symbol-option[aria-selected='true'] {
        background: linear-gradient(90deg, rgba(123, 47, 247, 0.28), rgba(0, 212, 255, 0.12));
      }

      .symbol-option .opt-ticker {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
        color: var(--c-text-strong);
      }

      /* ---------------- Active chart ---------------- */
      .chart-panel {
        background: var(--c-surface-2);
        border-radius: var(--r-sm);
        overflow: hidden;
        position: relative;
        /* Dominant component: fills all remaining height in the Charts column. */
        flex: 1 1 auto;
        min-height: 0;
      }

      .chart-panel .chart-host {
        width: 100%;
        height: 100%;
      }

      .chart-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: var(--fs-sm);
        color: var(--c-text-faint);
        text-align: center;
        padding: var(--sp-5);
      }

      .chart-message.error {
        color: var(--c-danger);
      }

      /* ---------------- Footer ---------------- */
      .footer {
        text-align: center;
        padding: var(--sp-4) var(--sp-3);
        padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom, 0px));
        font-size: var(--fs-2xs);
        color: #555;
        border-top: var(--hairline) solid var(--c-border-soft);
      }

      /* ==============================================================
           APP SHELL — two-workspace terminal (Charts / KEEN).
           Presentation only. The whole app is pinned to the viewport;
           scrolling happens inside regions, never on <body>. Workspace
           switching is a pure CSS visibility flip on data-workspace — no
           reload, no re-analysis; both panels stay mounted so the chart
           widget and the analysis DOM are never rebuilt on switch.
           ============================================================== */
      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .app-header {
        flex: 0 0 auto;
        position: relative;
        z-index: 10; /* keep the symbol dropdown above the workspaces */
      }
      .app-body {
        flex: 1 1 auto;
        min-height: 0; /* lets the inner regions own the scroll */
        position: relative;
      }
      /* Small, always-visible footer pinned to the bottom of the app shell:
           copyright + a link to the disclaimer. Kept intentionally thin. */
      /* Unified footer — shared across dashboard / calc / validation / disclaimer. */
      .app-footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--sp-3);
        padding: var(--sp-2);
        padding-bottom: calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
        font-size: var(--fs-xs);
        color: var(--c-text-faint);
        background: linear-gradient(280deg, var(--c-surface-2) 0%, #16213e 100%);
        border-top: var(--hairline) solid var(--c-border-soft);
        flex-direction: row-reverse;
      }
      .app-footer a {
        display: inline-flex;
        font-weight: bold;
        align-items: center;
        gap: var(--sp-1);
        color: var(--c-text-muted);
        text-decoration: none;
        transition: color 0.2s;
      }
      .app-footer a:hover {
        color: var(--c-accent-2);
      }
      .app-footer a:focus-visible {
        outline: 2px solid var(--c-accent-2);
        outline-offset: 2px;
        border-radius: var(--r-sm);
      }
      .app-footer a i {
        color: var(--c-accent-2);
        font-size: 0.9em;
      }
      .app-footer .foot-links {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-4);
        flex-wrap: wrap;
      }

      /* Header row: brand | status | header-actions (workspace toggle, Calculator, Save Profile). */
      .header h1 {
        flex: 0 1 auto;
      }
      .header .status {
        margin-inline-end: auto;
      }

      /* Connection indicator reuses the status dot, recoloured by real state. */
      #connDot {
        background: var(--qtw-neutral);
        animation: none;
      }
      #connDot.is-loading {
        background: var(--qtw-warn);
        animation: pulse 2s infinite;
      }
      #connDot.is-ok {
        background: var(--c-live);
        animation: pulse 2s infinite;
      }
      #connDot.is-error {
        background: var(--qtw-bear);
        animation: none;
      }

      /* Compact connection chip in the header: pulse dot only (real observed
           proxy state is exposed via the title/aria-label, not visible text). */
      .conn-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* ---- Header actions: workspace toggle, Calculator, Save Profile ----
           Grouped together, fixed at the end of the header row. */
      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-2);
        flex: 0 0 auto;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--control-h);
        height: var(--control-h);
        padding: 0;
        background: black;
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-md);
        cursor: pointer;
        flex: 0 0 auto;
        font-size: clamp(1rem, 0.9rem + 0.3vw, 1.2rem);
        line-height: 1;
        color: var(--c-text);
        text-decoration: none;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      .icon-btn:hover {
        background: var(--c-elevated);
      }
      .icon-btn:focus-visible {
        outline: 2px solid var(--c-accent-2);
        outline-offset: 2px;
      }
      .icon-btn i {
        font-size: 0.95em;
        line-height: 1;
      }

      /* Colourful, accessible header glyphs (FontAwesome, locally hosted). */
      #wsToggle i {
        color: var(--c-ico-chart);
      }
      #calcLink i {
        color: var(--c-ico-calc);
      }
      #validationLink i {
        color: var(--c-ico-valid);
      }

      /* Save-profile toggle — unmistakable ON / OFF states.
           OFF: dimmed, greyed glyph, neutral chrome.
           ON:  green glyph, green ring + soft glow, tinted fill. */
      #saveProfileBtn {
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          opacity 0.2s;
      }
      #saveProfileBtn i {
        color: var(--c-text-faint);
        transition:
          color 0.2s,
          transform 0.2s;
      }
      #saveProfileBtn[aria-pressed='false'] {
        opacity: 0.6;
      }
      #saveProfileBtn[aria-pressed='true'] {
        opacity: 1;
        border-color: var(--c-ico-save);
        background: rgba(52, 211, 153, 0.14);
        box-shadow:
          0 0 0 1px rgba(52, 211, 153, 0.35),
          0 0 12px rgba(52, 211, 153, 0.28);
      }
      #saveProfileBtn[aria-pressed='true'] i {
        color: var(--c-ico-save);
        transform: scale(1.08);
      }

      /* Brand acts as a "home" control (jumps to Charts) — cue it as clickable. */
      .header h1#brandHome {
        cursor: pointer;
        user-select: none;
      }
      .header h1#brandHome:focus-visible {
        outline: 2px solid var(--c-brand-1);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* Brand glyph in the H1 — opt out of the gradient text-clip so it keeps
           its own solid colour instead of rendering transparent. */
      .header h1 .brand-ico {
        -webkit-text-fill-color: var(--c-brand-1);
        color: var(--c-brand-1);
        font-size: 0.9em;
        margin-right: 0.4em;
      }

      /* ---- Workspaces: stacked in the same area, only the active shown ---- */
      .workspace {
        position: absolute;
        inset: 0;
        display: none;
        overflow: hidden;
      }
      .app[data-workspace='charts'] #wsPanelCharts {
        display: flex;
        flex-direction: column;
      }
      .app[data-workspace='KEEN'] #wsPanelKEEN {
        display: flex;
        flex-direction: column;
      }

      /* ---- Charts workspace: the chart is the dominant component ---- */
      #wsPanelCharts {
        gap: var(--sp-2);
        padding: var(--sp-2);
      }
      #wsPanelCharts .ticker-bar {
        flex: 0 0 auto;
        border-radius: var(--r-sm);
      }

      /* ---- KEEN workspace: the analysis scrolls inside its own region ---- */
      .analysis-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
      }

      /* ==============================================================
           THE WORKSTATION — quantitative analysis presentation layer.
           Pure presentation: every value rendered here is read verbatim
           from the recommendation object produced by engine/qt-*.js.
           No calculation happens in this stylesheet or in qt-card.js.
           ============================================================== */
      :root {
        --qtw-bull: #2fd480;
        --qtw-bull-soft: rgba(47, 212, 128, 0.14);
        --qtw-bear: #ff5d6c;
        --qtw-bear-soft: rgba(255, 93, 108, 0.14);
        --qtw-warn: #ffb020;
        --qtw-warn-soft: rgba(255, 176, 32, 0.14);
        --qtw-info: #3aa8ff;
        --qtw-info-soft: rgba(58, 168, 255, 0.14);
        --qtw-ai: #b07bff;
        --qtw-ai-soft: rgba(176, 123, 255, 0.14);
        --qtw-neutral: #9aa0b4;
        --qtw-neutral-soft: rgba(154, 160, 180, 0.14);
        --qtw-track: rgba(255, 255, 255, 0.08);
        /* ---- Data-type FAMILY accents ----
               A separate colour system from the tone tokens above: tone means
               "what this VALUE says" (bullish/bearish/warning/informational);
               family means "what KIND of card this is" (levels, pulse,
               confidence, evidence), independent of any value inside it. Two
               families reuse a tone hue on purpose (confidence↔ai, since
               confidence literally IS ai-derived; evidence↔neutral, since
               evidence/gate chips already default to neutral) — the other two
               need their own tokens because no warm/teal tone token exists,
               and reusing --qtw-warn for the Levels family would make every
               Levels card read as "this has a warning". */
        --qtw-fam-levels: #e8a33d;
        --qtw-fam-levels-soft: rgba(232, 163, 61, 0.14);
        --qtw-fam-pulse: #2dd4bf;
        --qtw-fam-pulse-soft: rgba(45, 212, 191, 0.14);
        --qtw-card-radius: 14px;
        --qtw-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        /* Lightened, workstation-local variants of --c-text-faint/--c-text-muted:
               the originals measure 3.28-3.66:1 and 4.16-4.40:1 against the card
               surfaces used here (WCAG AA needs 4.5:1 for normal-size text). Scoped
               to .qtw-* only so the pre-existing dashboard chrome is untouched. */
        --qtw-text-faint: #8a8ab2; /* >=5.17:1 on every card surface */
        --qtw-text-muted: #8a8aa4; /* >=4.82:1 on every card surface */
      }

      .analysis-area {
        padding: var(--sp-4);
        max-width: 1700px;
        margin: 0 auto;
      }
      .qt-card-host:empty {
        display: none;
      }
      .qtw {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }

      /* ---- Dual interface modes (Phase 8.5) ----
           Pure visibility switch: the DOM is built once by qt-card.js; only
           display is toggled here. Analyst-only sections/gauges are tagged
           with .qtw-analyst-only and hidden while data-mode="trader". */
      .qtw[data-mode='trader'] .qtw-analyst-only {
        display: none;
      }
      .qtw[data-mode='analyst'] .qtw-trader-only {
        display: none;
      }

      /* Segmented control sized and coloured to sit alongside the Analyze
           button (same control height, radius and green primary gradient). */
      .qtw-mode-toggle {
        display: inline-flex;
        align-items: stretch;
        gap: 2px;
        flex: 0 0 auto;
        height: var(--control-h);
        background: var(--c-surface-2);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-md);
        padding: 2px;
      }
      .qtw-mode-toggle input[type='radio'] {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .qtw-mode-toggle label {
        display: inline-flex;
        align-items: center;
        font-size: var(--fs-xs);
        color: var(--c-text-dim);
        padding: 0 var(--sp-3);
        border-radius: calc(var(--r-md) - 1px);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .qtw-mode-toggle label:hover {
        color: var(--c-text);
      }
      .qtw-mode-toggle input[type='radio']:checked + label {
        background: linear-gradient(135deg, #00b894, #00d4ff);
        color: #04121a;
        font-weight: 700;
      }
      .qtw-mode-toggle input[type='radio']:focus-visible + label {
        outline: 2px solid var(--c-accent-2);
        outline-offset: 1px;
      }

      /* ---- Tone utilities: colour only, never structure ---- */
      .qtw-tone-bull {
        color: var(--qtw-bull);
      }
      .qtw-tone-bear {
        color: var(--qtw-bear);
      }
      .qtw-tone-warn {
        color: var(--qtw-warn);
      }
      .qtw-tone-info {
        color: var(--qtw-info);
      }
      .qtw-tone-ai {
        color: var(--qtw-ai);
      }
      .qtw-tone-neutral {
        color: var(--qtw-neutral);
      }

      /* =====================================================
           HERO
           ===================================================== */
      .qtw-hero {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
        padding: var(--sp-5);
        border-radius: var(--qtw-card-radius);
        background: linear-gradient(135deg, var(--c-surface-2), var(--c-surface-3));
        border: var(--hairline) solid var(--c-border);
        box-shadow: var(--qtw-shadow);
        position: relative;
        overflow: hidden;
      }
      .qtw-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(600px 200px at 0% 0%, var(--qtw-glow, transparent), transparent 70%);
        opacity: 0.5;
      }
      .qtw-hero.qtw-tone-bull {
        --qtw-glow: var(--qtw-bull-soft);
        border-left: 3px solid var(--qtw-bull);
      }
      .qtw-hero.qtw-tone-bear {
        --qtw-glow: var(--qtw-bear-soft);
        border-left: 3px solid var(--qtw-bear);
      }
      .qtw-hero.qtw-tone-neutral {
        --qtw-glow: var(--qtw-neutral-soft);
        border-left: 3px solid var(--qtw-neutral);
      }
      .qtw-hero.qtw-tone-info {
        --qtw-glow: var(--qtw-ai-soft);
        border-left: 3px solid var(--qtw-ai);
      }
      .qtw-hero.qtw-int-weak {
        opacity: 0.92;
      }
      .qtw-hero.qtw-int-strong .qtw-hero-icon {
        filter: drop-shadow(0 0 10px currentColor);
      }

      /* Top band: confidence ring (left) + signal identity (right). Stays a
           2-column split at every width (mobile included) per the new design. */
      .qtw-hero-top {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: var(--sp-5);
        z-index: 1;
      }
      .qtw-hero-signal {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
        min-width: 0;
      }
      .qtw-hero-labelrow {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        flex-wrap: wrap;
        min-width: 0;
      }
      .qtw-hero-icon {
        font-size: clamp(1.8rem, 1.4rem + 1vw, 2.6rem);
        line-height: 1;
        flex: 0 0 auto;
        color: inherit;
      }
      .qtw-hero.qtw-tone-bull .qtw-hero-icon,
      .qtw-hero.qtw-tone-bull .qtw-hero-label {
        color: var(--qtw-bull);
      }
      .qtw-hero.qtw-tone-bear .qtw-hero-icon,
      .qtw-hero.qtw-tone-bear .qtw-hero-label {
        color: var(--qtw-bear);
      }
      .qtw-hero.qtw-tone-neutral .qtw-hero-icon,
      .qtw-hero.qtw-tone-neutral .qtw-hero-label {
        color: var(--qtw-neutral);
      }
      .qtw-hero.qtw-tone-info .qtw-hero-icon,
      .qtw-hero.qtw-tone-info .qtw-hero-label {
        color: var(--qtw-ai);
      }
      .qtw-hero-label {
        margin: 0;
        font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
        min-width: 0;
        /* Wrap longer labels (Weak Sell, No Trade, Waiting…) rather than
               truncating with an ellipsis. */
        overflow-wrap: break-word;
      }
      .qtw-hero-trend {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-size: var(--fs-md);
        font-weight: 600;
      }
      .qtw-hero-trend i {
        font-size: 0.9em;
        opacity: 0.9;
      }
      .qtw-hero-tf {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-size: clamp(1.1rem, 0.9rem + 0.8vw, 1.5rem);
        font-weight: 800;
        color: var(--c-text-strong);
      }
      .qtw-hero-tf i {
        color: var(--c-brand-1);
        font-size: 0.85em;
      }
      .qtw-hero-chips {
        display: flex;
        gap: var(--sp-2);
        flex-wrap: wrap;
        z-index: 1;
      }

      /* Live TradingView quote — sits in Trade Setup, directly under the Key
           Levels ladder, so the live number reads against Entry/Stop/Targets
           without scrolling. min-height reserves the widget's row up front so
           the card doesn't jump when the iframe lands; the whole wrap is
           removed outright if the embed never paints (see mountLiveQuote in
           the inline script), so an empty strip is never left behind. */
      .qtw-live-quote-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .qtw-live-quote-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-2xs);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--c-text-dim);
      }
      /* "reference only" reads as ordinary sentence-case prose, not a shouted
           label, and is visually quieter (faint, not dim) than the LIVE PRICE
           heading it qualifies. */
      .qtw-live-quote-note {
        text-transform: none;
        letter-spacing: normal;
        color: var(--qtw-text-faint);
      }
      .qtw-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--qtw-bull);
        box-shadow: 0 0 0 3px var(--qtw-bull-soft);
      }
      .qtw-live-quote {
        min-height: 46px;
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.03);
        overflow: hidden;
      }
      .qtw-live-quote .tradingview-widget-container,
      .qtw-live-quote .tradingview-widget-container__widget {
        width: 100%;
      }
      .qtw-live-quote .tradingview-widget-copyright {
        display: none;
      }

      /* Executive trade ladder inside the hero (spans the full width). */
      .qtw-hero-strip {
        grid-column: 1 / -1;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        margin-top: var(--sp-3);
        padding-top: var(--sp-4);
        border-top: var(--hairline) solid var(--c-border);
      }
      .qtw-hs-cell {
        flex: 1 1 auto;
        min-width: 92px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: rgba(255, 255, 255, 0.03);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-md);
        padding: var(--sp-2) var(--sp-3);
      }
      .qtw-hs-cell.qtw-tone-bull {
        border-color: rgba(47, 212, 128, 0.35);
      }
      .qtw-hs-cell.qtw-tone-bear {
        border-color: rgba(255, 93, 108, 0.35);
      }
      .qtw-hs-cell.qtw-tone-ai {
        border-color: rgba(176, 123, 255, 0.35);
      }
      .qtw-hs-label {
        font-size: var(--fs-2xs);
        color: var(--qtw-text-faint);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .qtw-hs-value {
        font-size: var(--fs-md);
        font-weight: 700;
        color: var(--c-text-strong);
        font-variant-numeric: tabular-nums;
      }
      .qtw-hs-note {
        color: var(--qtw-text-muted);
        font-size: var(--fs-sm);
        padding: var(--sp-2);
      }

      .qtw-hero-ring {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-2);
        z-index: 1;
      }

      .qtw-hero-facts {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--sp-3) var(--sp-4);
        z-index: 1;
      }
      .qtw-fact {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      /* Desktop: the vertical stack wastes the right half of a wide hero. Lay the
           sections into a 2-column grid so the facts sit BESIDE the signal (right),
           with chips under the signal and the ladder spanning full width. This
           removes the empty horizontal space and balances the card. Below 900px it
           reverts to the mobile stack (flex-column) automatically. */
      @media (min-width: 900px) {
        .qtw-hero {
          display: grid;
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
          grid-template-areas:
            'top    facts'
            'chips  facts'
            'ladder ladder';
          column-gap: var(--sp-5);
          row-gap: var(--sp-3);
          align-items: start;
        }
        .qtw-hero-top {
          grid-area: top;
        }
        .qtw-hero-chips {
          grid-area: chips;
        }
        .qtw-hero-facts {
          grid-area: facts;
          align-self: center;
          padding-left: var(--sp-5);
          border-left: var(--hairline) solid var(--c-border);
        }
        .qtw-hero-strip {
          grid-area: ladder;
          margin-top: var(--sp-2);
        }
      }
      .qtw-fact-label {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .qtw-fact-value {
        font-size: var(--fs-sm);
        font-weight: 700;
        color: var(--c-text-strong);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* =====================================================
           RINGS & GAUGES  (inline SVG, no chart library)
           ===================================================== */
      .qtw-ring {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .qtw-ring-svg {
        display: block;
      }
      .qtw-ring-fill {
        transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .qtw-ring-dim .qtw-ring-fill {
        opacity: 0.25;
      }
      .qtw-ring-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
      }
      .qtw-ring-value {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--c-text-strong);
        font-variant-numeric: tabular-nums;
      }
      .qtw-ring-sub {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .qtw-gauges {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(96px, 100%), 1fr));
        gap: var(--sp-3);
        text-align: center;
      }
      .qtw-gauge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-1);
      }
      .qtw-gauge .qtw-ring-value {
        font-size: 1rem;
      }
      .qtw-gauge-label {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .qtw-gauge-sub {
        font-size: 0.6rem;
        color: var(--qtw-text-faint);
      }
      .qtw-gauge-na .qtw-ring-value {
        color: var(--qtw-text-faint);
      }

      /* =====================================================
           EXECUTIVE SUMMARY
           ===================================================== */
      .qtw-summary .qtw-card-body {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }
      .qtw-exec {
        font-size: var(--fs-md);
        line-height: 1.6;
        color: var(--c-text);
      }
      .qtw-exec-row {
        display: flex;
        align-items: baseline;
        gap: var(--sp-3);
        flex-wrap: wrap;
      }
      .qtw-exec-note {
        font-size: var(--fs-xs);
        color: var(--qtw-text-muted);
      }

      /* Decision-confidence guidance banner (mixed/aligned/ambiguous signals).
           Tone class (qtw-tone-bull/bear/warn/info) sets `color`; the banner uses
           currentColor for its accent and a matching soft fill. */
      .qtw-guidance {
        display: flex;
        gap: var(--sp-3);
        align-items: flex-start;
        padding: var(--sp-3) var(--sp-4);
        border-radius: var(--r-md);
        border-left: 3px solid currentColor;
        background: var(--c-surface-2);
      }
      .qtw-guidance.qtw-tone-bull {
        background: var(--qtw-bull-soft);
      }
      .qtw-guidance.qtw-tone-bear {
        background: var(--qtw-bear-soft);
      }
      .qtw-guidance.qtw-tone-warn {
        background: var(--qtw-warn-soft);
      }
      .qtw-guidance.qtw-tone-info {
        background: var(--qtw-info-soft);
      }
      .qtw-guidance-ico {
        color: currentColor;
        margin-top: 2px;
        font-size: 1.05em;
        flex: none;
      }
      .qtw-guidance-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .qtw-guidance-head {
        font-weight: 600;
        color: var(--c-text-strong);
        font-size: var(--fs-sm);
        line-height: 1.4;
      }
      .qtw-guidance-action {
        font-size: var(--fs-xs);
        color: var(--qtw-text-muted);
        line-height: 1.4;
      }
      .qtw-balance {
        display: flex;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 4px;
        max-width: 340px;
        background: var(--c-surface-3);
      }
      .qtw-balance-sup {
        background: var(--qtw-bull);
      }
      .qtw-balance-opp {
        background: var(--qtw-bear);
      }

      /* Asset-focus panel — per-asset-class indicator reading aid. */
      .qtw-focus-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--sp-2);
        margin-top: var(--sp-3);
      }
      .qtw-focus-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: var(--sp-2) var(--sp-3);
        background: var(--c-surface-2);
        border-radius: var(--r-sm);
        border: var(--hairline) solid var(--c-border-soft);
        min-width: 0;
      }
      .qtw-focus-label {
        font-size: var(--fs-2xs);
        color: var(--qtw-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qtw-focus-val {
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--c-text-strong);
        font-variant-numeric: tabular-nums;
      }
      .qtw-focus-na {
        color: var(--c-text-dim);
        font-weight: 400;
      }

      /* Transient status toast (Save-Profile feedback, etc.). */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--sp-5) + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(12px);
        max-width: min(92vw, 460px);
        padding: var(--sp-3) var(--sp-4);
        background: var(--c-surface-2);
        color: var(--c-text-strong);
        border: var(--hairline) solid var(--c-border-hover);
        border-radius: var(--r-md);
        box-shadow: var(--shadow);
        font-size: var(--fs-sm);
        z-index: 200;
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .toast[hidden] {
        display: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast i {
        flex: none;
      }
      .toast.toast-on i {
        color: var(--c-ico-save);
      }
      .toast.toast-off i {
        color: var(--c-text-faint);
      }

      /* =====================================================
           CARD / SECTION shell  (native <details>/<summary>)
           ===================================================== */
      /* ---- Fluid card grid ----
           Column COUNT is derived from the available width, not from
           breakpoints: auto-fit collapses empty tracks, so the same rule yields
           1 column on a phone and 4 on a wide desktop with nothing to maintain.
           min() keeps the 340px ideal from overflowing viewports narrower than
           that (a bare minmax(340px, 1fr) would force a horizontal scrollbar).

           Two independent gap sources, two separate fixes:

           1. align-items: stretch (was `start`). `start` let every card keep its
              natural height, so a short card beside a tall one left a visible
              hole in its row. Stretch makes each card fill its row height.

           2. grid-auto-flow: dense. The full-width cards (.qtw-wide) split the
              normal-width ones apart, so in Trader mode - where several cards
              are hidden - a lone card would sit in a 3-column row with two empty
              cells beside it. Dense lets a later normal-width card backfill that
              hole instead of stranding it. Measured before/after on the live
              page; without it, Trader mode strands both Market Health and MTF.

           Dense reorders cards visually relative to the DOM, which is why it is
           applied HERE and not to the page as a whole: these are independent,
           self-labelled collapsible panels with no sequential narrative, so the
           visual reflow does not change their meaning. */
      .qtw-grid {
        display: grid;
        /* Floor = at least 340px, but also at least a third of a row, so a
               4th or 5th column can never open up. Analyst Mode has exactly
               three normal-width cards; letting five thin columns form left two
               of them empty on a wide monitor. Ratio maths, not a breakpoint. */
        grid-template-columns: repeat(auto-fit, minmax(min(100%, max(340px, 33.333% - var(--sp-4))), 1fr));
        grid-auto-flow: dense;
        gap: var(--sp-4);
        align-items: stretch;
      }
      /* Trader Mode hides most cards, leaving only a couple of normal-width
           ones. At the 340px floor those two would sit in a 3-column row with a
           third cell empty. A wider floor resolves the same content into fewer,
           roomier columns that fill the row - fewer cards genuinely deserve more
           space each, so this reads as intent rather than as a patch. Analyst
           Mode keeps the 340px floor: it has enough cards to fill 3 columns.

           The track floor reads outward-in: at least 480px, but also at least
           half a row (`50% - half the gap`) so a THIRD column can never form and
           strand an empty cell on a wide monitor - and never more than 100%, so
           a phone still gets exactly one column. Pure ratio maths, no breakpoint. */
      .qtw[data-mode='trader'] .qtw-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, max(480px, 50% - var(--sp-4) / 2)), 1fr));
      }

      /* Full-bleed at ANY column count - no 2-column assumption baked in. */
      .qtw-card.qtw-wide {
        grid-column: 1 / -1;
      }

      .qtw-card,
      .qtw-summary {
        background: var(--c-surface-2);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--qtw-card-radius);
        overflow: hidden;
      }
      /* NOTE: deliberately no `display:flex` on .qtw-card. A couple of these
           cards (Technical Details, Engine Inspection) are still <details>
           elements, and giving a <details> a flex/grid display box makes
           several engines leak the collapsed content into view. The grid's
           align-items:stretch already sizes the shell to the full row height
           while the content flows naturally from the top - which is exactly the
           result wanted, with none of the risk. */
      .qtw-card-head {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        padding: var(--sp-3) var(--sp-4);
        list-style: none;
        user-select: none;
      }
      /* Interactivity (pointer cursor, hover highlight, collapse caret) is
           scoped to the TAG, not a class: section() emits <summary>, the two
           remaining collapsible panels (Technical/Inspection); staticCard() and
           familyCard() emit a plain <div>, every always-open panel. Tag-scoping
           means a static card can never accidentally inherit "this is
           clickable" affordances, without needing a class to opt out of them. */
      summary.qtw-card-head {
        cursor: pointer;
      }
      summary.qtw-card-head::-webkit-details-marker {
        display: none;
      }
      summary.qtw-card-head:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .qtw-card-badge {
        font-size: 0.6rem;
        color: var(--qtw-text-faint);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-sm);
        padding: 1px 5px;
        flex: 0 0 auto;
      }
      .qtw-card-title {
        margin: 0;
        flex: 1;
        font-weight: 700;
        font-size: var(--fs-sm);
        color: var(--c-text-strong);
      }
      .qtw-card-meta {
        font-size: var(--fs-2xs);
        color: var(--qtw-text-faint);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      .qtw-card-caret {
        color: var(--c-text-dim);
        font-size: 0.65rem;
        transition: transform 0.2s;
        flex: 0 0 auto;
      }
      .qtw-card[open] > .qtw-card-head .qtw-card-caret {
        transform: rotate(180deg);
      }
      .qtw-card-body {
        padding: 0 var(--sp-4) var(--sp-4);
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .qtw-lvl4 .qtw-card-head,
      .qtw-lvl5 .qtw-card-head {
        background: rgba(255, 255, 255, 0.015);
      }
      .qtw-lvl5 {
        border-style: dashed;
      }

      /* ---- Data-type family header (staticCard / familyCard) ----
           A coloured left border plus a matching icon swatch let a reader
           recognise a card's kind (price levels, market pulse, confidence,
           evidence) before reading a word of its content — the "separate,
           sort and style by data type" requirement. Executive Summary and
           Warnings render this same header with no icon and no family class,
           so they get the plain title-only look (no border, no swatch),
           appropriate for narrative/severity content that isn't a data type. */
      .qtw-card.qtw-fam-levels {
        border-left: 3px solid var(--qtw-fam-levels);
      }
      .qtw-card.qtw-fam-pulse {
        border-left: 3px solid var(--qtw-fam-pulse);
      }
      .qtw-card.qtw-fam-confidence {
        border-left: 3px solid var(--qtw-ai);
      }
      .qtw-card.qtw-fam-evidence {
        border-left: 3px solid var(--qtw-neutral);
      }

      .qtw-fam-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: var(--r-md);
        flex: 0 0 auto;
        font-size: 0.7rem;
      }
      .qtw-fam-levels .qtw-fam-icon {
        background: var(--qtw-fam-levels-soft);
        color: var(--qtw-fam-levels);
      }
      .qtw-fam-pulse .qtw-fam-icon {
        background: var(--qtw-fam-pulse-soft);
        color: var(--qtw-fam-pulse);
      }
      .qtw-fam-confidence .qtw-fam-icon {
        background: var(--qtw-ai-soft);
        color: var(--qtw-ai);
      }
      .qtw-fam-evidence .qtw-fam-icon {
        background: var(--qtw-neutral-soft);
        color: var(--qtw-neutral);
      }

      .qtw-subhead {
        font-size: var(--fs-2xs);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--c-text-dim);
        margin-top: var(--sp-2);
      }
      .qtw-note {
        color: var(--qtw-text-faint);
        font-size: var(--fs-2xs);
        line-height: 1.5;
      }
      .qtw-plainlist {
        list-style: none;
        display: grid;
        gap: 4px;
      }
      .qtw-plainlist li {
        font-size: var(--fs-2xs);
        color: var(--qtw-text-muted);
        line-height: 1.5;
        padding-left: 10px;
        position: relative;
      }
      .qtw-plainlist li::before {
        content: '—';
        position: absolute;
        left: 0;
        color: var(--qtw-text-faint);
      }

      /* =====================================================
           CHIPS
           ===================================================== */
      .qtw-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--fs-2xs);
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--qtw-neutral-soft);
        color: var(--c-text);
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qtw-chip-badge {
        font-size: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        padding: 1px 4px;
        flex: 0 0 auto;
      }
      .qtw-chip.qtw-tone-bull {
        background: var(--qtw-bull-soft);
        color: var(--qtw-bull);
      }
      .qtw-chip.qtw-tone-bear {
        background: var(--qtw-bear-soft);
        color: var(--qtw-bear);
      }
      .qtw-chip.qtw-tone-warn {
        background: var(--qtw-warn-soft);
        color: var(--qtw-warn);
      }
      .qtw-chip.qtw-tone-info {
        background: var(--qtw-info-soft);
        color: var(--qtw-info);
      }
      .qtw-chip.qtw-tone-ai {
        background: var(--qtw-ai-soft);
        color: var(--qtw-ai);
      }
      .qtw-chip-o {
        background: transparent;
        border: var(--hairline) solid currentColor;
        opacity: 0.9;
      }
      .qtw-chipwrap {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
      }

      /* =====================================================
           STATUS ICONS  (qualification gates)
           ===================================================== */
      .qtw-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        font-size: 0.65rem;
        font-weight: 800;
        flex: 0 0 auto;
      }
      .qtw-status-pass {
        background: var(--qtw-bull-soft);
        color: var(--qtw-bull);
      }
      .qtw-status-fail {
        background: var(--qtw-bear-soft);
        color: var(--qtw-bear);
      }
      .qtw-status-info {
        background: var(--qtw-info-soft);
        color: var(--qtw-info);
      }

      /* =====================================================
           KEY LEVELS LADDER  (replaces the old grid-of-cells ticket)
           ===================================================== */
      /* Rows read top-to-bottom in PRICE order (highest first) — DOM order is
           visual order is reading order, so no JS geometry/positioning is
           needed and screen readers get the same sequence sighted users do. */
      .qtw-ladder {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
      }
      /* Spine: purely decorative, ties the rows together visually as one
           ladder. 7px = half of the 14px dot column, so it lands under the
           dot centres without any JS measurement. */
      .qtw-ladder::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 14px;
        bottom: 14px;
        width: 2px;
        background: var(--c-border-soft);
        z-index: 0;
      }
      .qtw-ladder-row {
        display: grid;
        position: relative;
        z-index: 1;
        grid-template-columns: 14px minmax(0, 5rem) minmax(0, 6rem) minmax(50px, 1fr) minmax(0, 10rem);
        align-items: center;
        gap: var(--sp-3);
        padding: 5px 0;
      }
      /* Tone is set once on the row (color: ...) and the dot/bar pick it up
           via currentColor, so adding a new tone never means touching two
           rules. Label/price opt back OUT of it below — only the dot and the
           distance bar should carry the tone; the numbers themselves stay
           legible, neutral text like every other price in the app. */
      .qtw-ladder-row.qtw-tone-bull {
        color: var(--qtw-bull);
      }
      .qtw-ladder-row.qtw-tone-bear {
        color: var(--qtw-bear);
      }
      .qtw-ladder-row.qtw-tone-ai {
        color: var(--qtw-ai);
      }
      .qtw-ladder-row.qtw-tone-neutral {
        color: var(--qtw-neutral);
      }
      .qtw-ladder-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        justify-self: center;
      }
      .qtw-ladder-label {
        font-size: var(--fs-2xs);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--c-text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qtw-ladder-price {
        font-size: var(--fs-sm);
        font-weight: 700;
        color: var(--c-text-strong);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .qtw-ladder-bar {
        position: relative;
        height: 6px;
        background: var(--c-surface);
        border-radius: 3px;
        overflow: hidden;
      }
      .qtw-ladder-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: currentColor;
        opacity: 0.85;
      }
      .qtw-ladder-sub {
        font-size: var(--fs-2xs);
        color: var(--qtw-text-faint);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 600px) {
        /* The sub column (R:R/probability/ATR-basis detail) is the first
               thing that can go — the price and its distance from Entry are
               the two facts that matter most on a phone. */
        .qtw-ladder-row {
          grid-template-columns: 14px minmax(0, 4.5rem) minmax(0, 5rem) minmax(40px, 1fr);
        }
        .qtw-ladder-sub {
          display: none;
        }
      }

      .qtw-metricrow {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr));
        gap: var(--sp-3);
        padding: var(--sp-3) 0;
        border-top: var(--hairline) solid var(--c-border-soft);
        border-bottom: var(--hairline) solid var(--c-border-soft);
      }
      .qtw-metric {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: center;
      }
      .qtw-metric-value {
        font-size: var(--fs-sm);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .qtw-metric-label {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
      }

      .qtw-levels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
        gap: var(--sp-4);
      }
      .qtw-level-col {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }
      .qtw-level-col h4 {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .qtw-no-trade {
        background: var(--c-surface);
        border: var(--hairline) dashed var(--c-border);
        border-radius: var(--r-lg);
        padding: var(--sp-5);
        text-align: center;
      }
      .qtw-no-trade-icon {
        font-size: 2rem;
        color: var(--qtw-text-faint);
      }
      .qtw-no-trade strong {
        display: block;
        margin: var(--sp-2) 0;
        color: var(--c-text-strong);
        font-size: var(--fs-md);
      }
      .qtw-no-trade p {
        font-size: var(--fs-xs);
        color: var(--qtw-text-muted);
        line-height: 1.5;
      }
      .qtw-no-trade .qtw-plainlist {
        text-align: left;
        max-width: 480px;
        margin: var(--sp-3) auto 0;
      }

      /* =====================================================
           MARKET STRUCTURE TIMELINE
           ===================================================== */
      .qtw-timeline {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        overflow-x: auto;
        padding: var(--sp-2) 0;
        -webkit-overflow-scrolling: touch;
      }
      .qtw-tl-node {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--r-md);
        flex: 0 0 auto;
        background: var(--c-surface);
        border: var(--hairline) solid var(--c-border);
      }
      .qtw-tl-node.qtw-tone-bull {
        border-color: rgba(47, 212, 128, 0.35);
      }
      .qtw-tl-node.qtw-tone-bear {
        border-color: rgba(255, 93, 108, 0.35);
      }
      .qtw-tl-badge {
        font-weight: 800;
        font-size: var(--fs-xs);
      }
      .qtw-tl-price {
        font-size: 0.62rem;
        color: var(--qtw-text-faint);
        font-variant-numeric: tabular-nums;
      }
      .qtw-eventcloud {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
      }

      /* =====================================================
           BARS  (score & confidence breakdown)
           ===================================================== */
      .qtw-barlist {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }
      /* Fluid, self-limiting columns: the label and value tracks scale with the
           reading size instead of sitting at fixed px, and the minmax(0, …) floor
           lets them compress inside a narrow grid column rather than overflow. */
      .qtw-barrow {
        display: grid;
        grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) minmax(0, 4rem);
        align-items: center;
        gap: var(--sp-3);
      }
      .qtw-barrow-label {
        font-size: var(--fs-2xs);
        color: var(--c-text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qtw-barrow-value {
        font-size: var(--fs-2xs);
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--qtw-text-muted);
      }

      .qtw-sbar {
        position: relative;
      }
      .qtw-sbar-track {
        position: relative;
        height: 8px;
        background: var(--c-surface);
        border-radius: 4px;
        overflow: hidden;
      }
      .qtw-sbar-mid {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--c-border-hover);
      }
      .qtw-sbar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        transition: width 0.4s ease;
      }
      .qtw-sbar-fill.qtw-tone-bull {
        background: var(--qtw-bull);
      }
      .qtw-sbar-fill.qtw-tone-bear {
        background: var(--qtw-bear);
      }

      .qtw-ubar-track {
        height: 8px;
        background: var(--c-surface);
        border-radius: 4px;
        overflow: hidden;
      }
      .qtw-ubar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.4s ease;
      }
      .qtw-ubar-fill.qtw-tone-ai {
        background: var(--qtw-ai);
      }
      .qtw-ubar-fill.qtw-tone-info {
        background: var(--qtw-info);
      }
      .qtw-ubar-fill.qtw-tone-warn {
        background: var(--qtw-warn);
      }

      .qtw-excluded {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-2);
      }
      .qtw-deltarow {
        display: flex;
        align-items: center;
        gap: var(--sp-3);
        font-size: var(--fs-2xs);
        color: var(--qtw-text-muted);
        padding-top: var(--sp-2);
        border-top: var(--hairline) solid var(--c-border-soft);
      }

      /* =====================================================
           EVIDENCE PANELS
           ===================================================== */
      .qtw-evidence-cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: var(--sp-4);
      }
      .qtw-evidence-col h4 {
        font-size: var(--fs-2xs);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: var(--sp-2);
      }

      /* =====================================================
           QUALIFICATION GATES
           ===================================================== */
      .qtw-gaterow {
        display: grid;
        grid-template-columns: auto 72px 1fr auto;
        align-items: center;
        gap: var(--sp-2);
        font-size: var(--fs-2xs);
        padding: 4px 0;
        border-bottom: var(--hairline) solid var(--c-border-soft);
      }
      .qtw-gaterow:last-child {
        border-bottom: none;
      }
      .qtw-gate-tier {
        color: var(--qtw-text-faint);
        text-transform: uppercase;
        font-size: 0.6rem;
      }
      .qtw-gate-id {
        color: var(--c-text);
      }
      .qtw-gate-vt {
        color: var(--qtw-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .qtw-gate-msg {
        grid-column: 1 / -1;
        color: var(--qtw-text-faint);
        padding-left: 26px;
      }

      /* =====================================================
           MTF PANEL
           ===================================================== */
      .qtw-mtf-facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr));
        gap: var(--sp-3);
      }

      /* =====================================================
           WARNINGS
           ===================================================== */
      .qtw-warncard {
        border-color: rgba(255, 176, 32, 0.3);
      }
      .qtw-warngroup {
        padding: var(--sp-2) 0;
      }
      .qtw-warngroup-title {
        font-size: var(--fs-2xs);
        font-weight: 700;
        color: var(--qtw-warn);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* =====================================================
           TABLE  (technical details)
           ===================================================== */
      .qtw-table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-2xs);
      }
      .qtw-table th {
        text-align: left;
        color: var(--c-text-dim);
        font-weight: 600;
        padding: 4px 6px;
        border-bottom: var(--hairline) solid var(--c-border);
      }
      .qtw-table td {
        padding: 4px 6px;
        border-bottom: var(--hairline) solid var(--c-border-soft);
        color: var(--qtw-text-muted);
      }
      .qtw-numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .qtw-pre {
        background: var(--c-bg);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--r-md);
        padding: var(--sp-3);
        font-size: 0.66rem;
        line-height: 1.5;
        color: var(--qtw-text-muted);
        overflow-x: auto;
        white-space: pre;
        max-height: 380px;
      }
      .qtw-inspect-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: var(--sp-3);
      }

      /* =====================================================
           FOOTER / STATUS / EMPTY
           ===================================================== */
      .qtw-foot {
        display: flex;
        justify-content: space-between;
        gap: var(--sp-3);
        flex-wrap: wrap;
        font-size: var(--fs-2xs);
        color: var(--qtw-text-faint);
        padding: var(--sp-2) var(--sp-2) 0;
      }
      .qtw-status-box {
        background: var(--c-surface-2);
        border: var(--hairline) solid var(--c-border);
        border-radius: var(--qtw-card-radius);
        padding: var(--sp-5);
        text-align: center;
      }
      .qtw-status-error {
        border-color: rgba(255, 93, 108, 0.4);
      }
      .qtw-status-box strong {
        color: var(--c-text-strong);
        display: block;
        margin-bottom: var(--sp-2);
      }
      .qtw-empty {
        color: var(--qtw-text-muted);
        text-align: center;
        padding: clamp(40px, 12vh, 120px) var(--sp-5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--sp-2);
      }
      .qtw-empty-icon {
        font-size: 2.4rem;
        opacity: 0.75;
        line-height: 1;
      }
      .qtw-empty strong {
        color: var(--c-text-strong);
        font-size: var(--fs-lg);
        font-weight: 700;
      }
      .qtw-empty p {
        max-width: 460px;
        font-size: var(--fs-sm);
        line-height: 1.6;
        color: var(--qtw-text-muted);
      }

      /* #analyzeBtn is the split button's main action (.analyze-main). Teal, and
           left-rounded only so it butts against the caret to form one control. */
      #analyzeBtn {
        height: var(--control-h);
        background: linear-gradient(135deg, #00b894, #00d4ff);
        color: #04121a;
        border: none;
        padding: 0 var(--sp-4);
        border-radius: var(--r-md) 0 0 var(--r-md);
        font-size: var(--ctrl-fs-btn);
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.2s,
          filter 0.2s;
      }
      #analyzeBtn:hover {
        opacity: 0.88;
      }
      #analyzeBtn:disabled {
        opacity: 0.5;
        cursor: progress;
      }

      /* Consistent keyboard focus rings on the primary action buttons
           (selects/triggers already show a focus border; these did not). */
      #analyzeBtn:focus-visible,
      .controls #reloadBtn:focus-visible {
        outline: 2px solid var(--c-accent-2);
        outline-offset: 2px;
      }
      /* =====================================================
           RESPONSIVE — cards stack, nothing overflows
           ===================================================== */
      @media (max-width: 1100px) {
        /* Hero is now a vertical stack (top band · chips · facts · ladder);
               the top band keeps its donut|signal split at all widths. */
        .qtw-hero-facts {
          grid-template-columns: repeat(2, 1fr);
          width: 100%;
        }
      }
      /* The old `max-width: 860px` block that flipped .qtw-grid to a single
           column is gone: auto-fit already collapses to one column exactly when
           the content stops fitting, at whatever width that happens to be. */
      @media (max-width: 600px) {
        .qtw-hero-facts {
          grid-template-columns: 1fr 1fr;
        }
        .qtw-gauges {
          grid-template-columns: repeat(3, 1fr);
        }
        .qtw-barrow {
          gap: var(--sp-2);
        }
        .qtw-gate-msg {
          padding-left: 0;
        }
      }

      /* ---------------- Below 760px: hide selector labels ----------------
           The controls stay self-explanatory (symbol logo/ticker, interval value,
           profile value). Labels are VISUALLY hidden — not display:none — so the
           #symbolLabel aria-labelledby target stays in the accessibility tree.
